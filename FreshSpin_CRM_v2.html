  currentUser:   null,

  expenses:      [],

  subscriptions: [],
  deliveries:    [],
};

function reducer(state, action) {
  switch (action.type) {
    case "LOAD_DATA":          return { ...state, ...action.data };
    case "LOGIN":              return { ...state, currentUser: action.user };
    case "LOGOUT":             return { ...state, currentUser: null };
    case "ADD_DELIVERY":       return { ...state, deliveries: [...(state.deliveries||[]), action.delivery] };
    case "DELETE_DELIVERY":    return { ...state, deliveries: (state.deliveries||[]).filter(d=>d.id!==action.id) };
    case "ADD_CLIENT":         return { ...state, clients: [...state.clients, action.client] };
    case "UPDATE_CLIENT":      return { ...state, clients: state.clients.map(c => c.id === action.client.id ? action.client : c) };
    case "DELETE_CLIENT":      return { ...state, clients: state.clients.filter(c => c.id !== action.id) };
    case "ADD_INVOICE":        return { ...state, invoices: [...state.invoices, action.invoice] };
    case "UPDATE_INVOICE_STATUS": {
      const inv = state.invoices.find(i => i.id === action.id);
      const loyaltyGain = inv && inv.status !== "delivered" && action.status === "delivered" ? Math.floor(inv.total / 10) : 0;
      return {
        ...state,
        invoices: state.invoices.map(i => i.id === action.id ? { ...i, status: action.status } : i),
        clients: loyaltyGain > 0 ? state.clients.map(c => c.id === inv.clientId ? { ...c, loyalty: c.loyalty + loyaltyGain } : c) : state.clients,
      };
    }
    case "DELETE_INVOICE":     return { ...state, invoices: state.invoices.filter(i => i.id !== action.id) };
    case "ADD_EXPENSE":        return { ...state, expenses: [...state.expenses, action.expense] };
    case "DELETE_EXPENSE":     return { ...state, expenses: state.expenses.filter(e => e.id !== action.id) };
    case "ADD_SHIFT":          return { ...state, shifts: [...state.shifts, action.shift] };
    case "UPDATE_SHIFT":       return { ...state, shifts: state.shifts.map(s => s.id === action.shift.id ? action.shift : s) };
    case "DELETE_SHIFT":       return { ...state, shifts: state.shifts.filter(s => s.id !== action.id) };
    case "UPDATE_HR_CONFIG":   return { ...state, hrConfig: { ...state.hrConfig, ...action.config } };
    case "ADD_SUBSCRIPTION":    return { ...state, subscriptions: [...(state.subscriptions||[]), action.sub] };
    case "UPDATE_SUBSCRIPTION": return { ...state, subscriptions: (state.subscriptions||[]).map(s => s.id === action.sub.id ? action.sub : s) };
    case "ADD_USER":           return { ...state, users: [...state.users, action.user] };
    case "UPDATE_USER":        return { ...state, users: state.users.map(u => u.id === action.user.id ? action.user : u) };
    case "TOGGLE_USER_ACTIVE": return { ...state, users: state.users.map(u => u.id === action.id ? { ...u, active: !u.active } : u) };
    default:                   return state;
  }
}

function Badge({ type, label }) {
  const [bg, fg] = BADGE[type] || [C.gray200, C.gray600];
  return <span style={{ ...S.badge(bg, fg) }}>{label || type}</span>;
}

function Avatar({ name, role, size = 36 }) {
  const bg = avatarColor(role);
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%", background: bg + "22",
      border: `2px solid ${bg}44`, display: "flex", alignItems: "center",
      justifyContent: "center", fontWeight: 800, fontSize: size * 0.33,
      color: bg, flexShrink: 0, letterSpacing: "0.02em",
    }}>{initials(name)}</div>
  );
}

    <div style={{ display: "flex", gap: 4, background: C.gray100, borderRadius: 10, padding: 4, marginBottom: 20, width: "fit-content" }}>
      {tabs.map(t => (
        <button key={t.key} onClick={() => onChange(t.key)}
          style={{ ...S.btn(active === t.key ? C.white : "transparent", active === t.key ? C.gray800 : C.gray500), boxShadow: active === t.key ? "0 1px 4px rgba(0,0,0,.1)" : "none", fontSize: 12, padding: "7px 16px", borderRadius: 8 }}>
          {t.icon && <span>{t.icon}</span>}{t.label}
        </button>
      ))}
    </div>
  );
}

function Modal({ title, onClose, children, width = 500 }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(15,23,42,.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: 24 }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ ...S.card, width, maxWidth: "100%", maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <h3 style={{ margin: 0, fontSize: 16, fontWeight: 800, color: C.gray900 }}>{title}</h3>
          <button onClick={onClose} style={{ ...S.btnSm(C.gray100, C.gray600), borderRadius: "50%", width: 30, height: 30, padding: 0, justifyContent: "center" }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children, style }) {
  return (
    <div style={{ marginBottom: 14, ...style }}>
      <label style={S.label}>{label}</label>
      {children}
    </div>
  );
}

// LOGIN
// ═══════════════════════════════════════════════════════════════════════════
function LoginScreen({ state, dispatch }) {
  const { lang, setLang } = React.useContext(LangCtx);
  const t = T[lang];
  const [email, setEmail]     = useState("");
  const [pass, setPass]       = useState("");
  const [error, setError]     = useState("");
  const [loading, setLoading] = useState(false);

  const login = async () => {
    if(!email||!pass){setError(t.login_error);return;}
    setLoading(true); setError("");
    try {
      const data = await fetch("/api/data").then(r=>r.json());
      const users = data.users||[];
      const user = users.find(u=>
        u.email.toLowerCase().trim()===email.toLowerCase().trim() &&
        u.password===pass && u.active!==false
      );
      if(user){
        dispatch({type:"LOAD_DATA", data});
        dispatch({type:"LOGIN", user});
      } else {
        setError(t.login_error);
      }
    } catch(err){
      setError("Connection error. Please try again.");
    }
    setLoading(false);
  };

  return (
    <div style={{ ...S.page, display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg,#0F172A 0%,#1E293B 50%,#0F2D40 100%)" }}>
      <div style={{ ...S.card, width: 400, textAlign: "center" }}>
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
          {["en","es"].map(l => (
            <button key={l} onClick={() => setLang(l)}
              style={{ ...S.btnSm(lang === l ? C.orange : C.gray100, lang === l ? "#fff" : C.gray500), marginLeft: 4, fontSize: 11, fontWeight: 800 }}>
              {l === "en" ? "🇺🇸 EN" : "🇩🇴 ES"}
            </button>
          ))}
        </div>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 32, fontWeight: 900, letterSpacing: "-0.04em", marginBottom: 4 }}>
            <span style={{ color: C.orange }}>FRESH</span><span style={{ color: C.teal }}>SPIN</span>
          </div>
          <div style={{ fontSize: 12, color: C.gray400, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.12em" }}>{t.login_subtitle}</div>
        </div>
        <Field label={t.login_email}>
          <input style={S.input} value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" type="email"
            onKeyDown={e => e.key === "Enter" && login()} />
        </Field>
        <Field label={t.login_password}>
          <input style={S.input} value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••" type="password"
            onKeyDown={e => e.key === "Enter" && login()} />
        </Field>
        {error && <div style={{ color: C.red, fontSize: 12, marginBottom: 12, background: C.redL, padding: "8px 12px", borderRadius: 8 }}>{error}</div>}
        <button style={{ ...S.btn(), width: "100%", justifyContent: "center", padding: "11px 0", fontSize: 14, opacity: loading?0.7:1 }} onClick={login} disabled={loading}>
          {loading ? "Signing in…" : t.login_btn}
        </button>
      </div>
    </div>
  );
}

// DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
function Dashboard({ state, setActive }) {
  const { lang } = React.useContext(LangCtx);
  const t = T[lang];
  const role = state.currentUser.role;
  const paidInvs = state.invoices.filter(i => i.status === "delivered");
  const totalRevenue  = paidInvs.reduce((s, i) => s + i.total, 0);
  const totalExpenses = state.expenses.reduce((s, e) => s + e.amount, 0);
  const pending       = state.invoices.filter(i => i.status === "pending").length;
  const myShifts = state.shifts.filter(s => s.employeeId === state.currentUser.id);
  const upcoming  = myShifts.filter(s => s.status === "scheduled").length;
  const completed = myShifts.filter(s => s.status === "completed").length;
  const isPriv = role === "owner" || role === "manager";

  return (
    <div>
      <div style={{ marginBottom: 22 }}>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: C.gray900, letterSpacing: "-0.02em" }}>
          {t.welcome}, {state.currentUser.name.split(" ")[0]} 👋
        </h2>
        <p style={{ margin: "4px 0 0", fontSize: 13, color: C.gray500 }}>{new Date().toLocaleDateString(lang === "es" ? "es-DO" : "en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</p>
      </div>

      {isPriv ? (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(170px,1fr))", gap: 14, marginBottom: 24 }}>
            <StatCard label={t.total_revenue}  value={fmtCurrency(totalRevenue)}   icon="💰" color={C.green}    />
            <StatCard label={t.total_expenses} value={fmtCurrency(totalExpenses)}  icon="📉" color={C.red}      />
            <StatCard label={t.net_profit}     value={fmtCurrency(totalRevenue - totalExpenses)} icon="📈" color={totalRevenue - totalExpenses >= 0 ? C.orange : C.red} />
            <StatCard label={t.active_clients} value={state.clients.length}        icon="👥" color={C.teal}     />
            <StatCard label={t.invoices}       value={state.invoices.length}       icon="🧾" color={C.gray600}  />
            <StatCard label={t.pending}        value={pending}                     icon="⏳" color={C.yellow}   />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <div style={S.card}>
              <h3 style={{ margin: "0 0 14px", fontSize: 14, fontWeight: 800, color: C.gray800 }}>{t.recent_invoices}</h3>
              <table style={S.table}>
                <thead><tr>{["ID", t.client_col, t.total, t.status].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {[...state.invoices].reverse().slice(0,5).map(i => (
                    <tr key={i.id}>
                      <td style={S.td}><b style={{ color: C.orange, fontSize: 12 }}>{i.id}</b></td>
                      <td style={S.td}>{i.clientName}</td>
                      <td style={S.td}><b>{fmtCurrency(i.total)}</b></td>
                      <td style={S.td}><Badge type={i.status} label={i.status === "delivered" ? t.delivered : t.pending} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={S.card}>
              <h3 style={{ margin: "0 0 14px", fontSize: 14, fontWeight: 800, color: C.gray800 }}>{t.latest_expenses}</h3>
              <table style={S.table}>
                <thead><tr>{[t.category, t.description, t.amount].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {[...state.expenses].reverse().slice(0,5).map(e => (
                    <tr key={e.id}>
                      <td style={S.td}><Badge type="pending" label={e.category} /></td>
                      <td style={S.td}>{e.description}</td>
                      <td style={{ ...S.td, color: C.red, fontWeight: 700 }}>{fmtCurrency(e.amount)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 14 }}>
          <StatCard label={t.my_upcoming}      value={upcoming}   icon="📅" color={C.teal}   />
          <StatCard label={t.completed_shifts} value={completed}  icon="✅" color={C.green}  />
          <StatCard label={t.invoices_created} value={state.invoices.filter(i => i.createdBy === state.currentUser.name).length} icon="🧾" color={C.orange} />
          <StatCard label={t.active_clients}   value={state.clients.length} icon="👥" color={C.gray600} />
        </div>
      )}
    </div>
  );
}

// POS / INVOICES
// ═══════════════════════════════════════════════════════════════════════════
function POS({ state, dispatch, prefillClientId }) {
  const { lang } = React.useContext(LangCtx);
  const t = T[lang];
  const svcLabel = s => lang === "es" ? (s.nameEs || s.name) : s.name;
  const [view,           setView]           = useState(prefillClientId ? "new" : "list");
  const [selectedClient, setSelectedClient] = useState(prefillClientId ? String(prefillClientId) : "");
  const [clientSearch,   setClientSearch]   = useState("");
  const [showDropdown,   setShowDropdown]   = useState(false);
  const [lines,          setLines]          = useState([{ name: "", qty: 1, price: 0 }]);
  const [invoiceNote,    setInvoiceNote]    = useState("");
  const [printInv,       setPrintInv]       = useState(null);
  const [filter,         setFilter]         = useState("all");
  const [search,         setSearch]         = useState("");
  const searchRef = useRef();

  useEffect(() => {
    if (prefillClientId) {
      setSelectedClient(String(prefillClientId));
      setView("new");
    }
  }, [prefillClientId]);

  const addLine    = () => setLines(prev => [...prev, { name: "", qty: 1, price: 0 }]);
  const removeLine = i  => setLines(prev => prev.filter((_, idx) => idx !== i));
  const updateLine = (i, field, val) => setLines(prev => prev.map((l, idx) => idx === i ? { ...l, [field]: val } : l));
  const applyService = (i, name) => {
    const svc = SERVICE_CATALOG.find(s => s.name === name);
    setLines(prev => prev.map((l, idx) => idx === i ? { ...l, name, price: svc?.price || 0 } : l));
  };
  const total = lines.reduce((s, l) => s + Number(l.qty) * Number(l.price), 0);

  const clientMatches = clientSearch.trim().length > 0
    ? state.clients.filter(c => {
        const q = clientSearch.toLowerCase();
        const qDigits = clientSearch.replace(/\D/g, "");
        return c.name.toLowerCase().includes(q) ||
          (qDigits.length >= 3 && c.phone.replace(/\D/g, "").includes(qDigits));
      })
    : [];

  const selectClientFromSearch = (c) => {
    setSelectedClient(String(c.id));
    setClientSearch(c.name);
    setShowDropdown(false);
  };

  const createInvoice = () => {
    const client = state.clients.find(c => c.id === Number(selectedClient));
    if (!client) return alert(t.alert_client);
    if (lines.every(l => !l.name)) return alert(t.alert_service);
    const inv = {
      id: `INV-${uid()}`, clientId: client.id, clientName: client.name,
      services: lines.filter(l => l.name), total,
      date: today(), status: "pending",
      createdBy: state.currentUser.name, notes: invoiceNote,
    };
    dispatch({ type: "ADD_INVOICE", invoice: inv });
    setPrintInv(inv);
    setView("print");
    setLines([{ name: "", qty: 1, price: 0 }]);
    setSelectedClient(""); setClientSearch(""); setInvoiceNote("");
  };

  const resetNew = () => {
    setView("list"); setSelectedClient(""); setClientSearch(""); setInvoiceNote("");
    setLines([{ name: "", qty: 1, price: 0 }]);
  };

  const displayed = [...state.invoices]
    .filter(i => filter === "all" || i.status === filter)
    .filter(i => !search || i.clientName.toLowerCase().includes(search.toLowerCase()) || i.id.toLowerCase().includes(search.toLowerCase()))
    .reverse();

  if (view === "print" && printInv) return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
        <button style={S.btn(C.gray200, C.gray800)} onClick={() => setView("list")}>{t.back_to_invoices}</button>
      </div>
      <div style={{ ...S.card, maxWidth: 520 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, paddingBottom: 16, borderBottom: `1px solid ${C.gray100}` }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 900, letterSpacing: "-0.03em" }}><span style={{ color: C.orange }}>FRESH</span><span style={{ color: C.teal }}>SPIN</span></div>
            <div style={{ fontSize: 11, color: C.gray400, fontWeight: 600 }}>{lang === "es" ? "Lavandería & Tintorería" : "Dry & Laundry"}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 18, fontWeight: 800, color: C.gray800 }}>{lang === "es" ? "FACTURA" : "INVOICE"}</div>
            <div style={{ fontSize: 13, color: C.orange, fontWeight: 700 }}>{printInv.id}</div>
            <div style={{ fontSize: 12, color: C.gray400 }}>{lang === "es" ? "Fecha" : "Date"}: {printInv.date}</div>
          </div>
        </div>
        <div style={{ marginBottom: 16, padding: "10px 14px", background: C.gray50, borderRadius: 8 }}>
          <div style={{ fontSize: 11, color: C.gray500, fontWeight: 700, marginBottom: 2 }}>{t.billed_to}</div>
          <div style={{ fontSize: 14, fontWeight: 700, color: C.gray800 }}>{printInv.clientName}</div>
          {(() => { const c = state.clients.find(x => x.id === printInv.clientId); return c ? <div style={{ fontSize: 12, color: C.gray500 }}>{c.phone} · {c.address}</div> : null; })()}
        </div>
        <table style={{ ...S.table, marginBottom: 14 }}>
          <thead><tr>{[
            lang === "es" ? "Servicio" : "Service",
            lang === "es" ? "Cant." : "Qty",
            lang === "es" ? "Precio Unit." : "Unit Price",
            "Total"
          ].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {printInv.services.map((s, i) => {
              const catalogItem = SERVICE_CATALOG.find(c => c.name === s.name);
              const displayName = lang === "es" && catalogItem ? (catalogItem.nameEs || s.name) : s.name;
              return (
                <tr key={i}>
                  <td style={S.td}>{displayName}</td>
                  <td style={S.td}>{s.qty}</td>
                  <td style={S.td}>{fmtCurrency(s.price)}</td>
                  <td style={{ ...S.td, fontWeight: 700 }}>{fmtCurrency(s.qty * s.price)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{ textAlign: "right", fontSize: 20, fontWeight: 900, color: C.orange, marginBottom: 8 }}>Total: {fmtCurrency(printInv.total)}</div>
        {printInv.notes && <div style={{ fontSize: 12, color: C.gray500, marginBottom: 12 }}>{lang === "es" ? "Nota" : "Note"}: {printInv.notes}</div>}
        <div style={{ fontSize: 11, color: C.gray400, textAlign: "center", marginBottom: 16 }}>
          {lang === "es" ? "¡Gracias por elegir FreshSpin! · Thank you!" : "Thank you for choosing FreshSpin · ¡Gracias!"}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button style={{ ...S.btn(printInv.status === "delivered" ? C.yellow : C.green), flex: 1, justifyContent: "center" }}
            onClick={() => {
              const next = printInv.status === "delivered" ? "pending" : "delivered";
              dispatch({ type: "UPDATE_INVOICE_STATUS", id: printInv.id, status: next });
              setPrintInv(p => ({ ...p, status: next }));
            }}>
            {printInv.status === "delivered" ? t.mark_pending : t.mark_delivered}
          </button>
          <button style={{ ...S.btn(C.teal), flex: 1, justifyContent: "center" }} onClick={() => window.print()}>{t.print}</button>
        </div>
      </div>
    </div>
  );

  if (view === "new") return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 22 }}>
        <button style={S.btn(C.gray200, C.gray800)} onClick={resetNew}>{t.back}</button>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: C.gray900 }}>{t.new_invoice_title}</h2>
      </div>
      <div style={{ ...S.card, maxWidth: 640 }}>
        <div style={{ marginBottom: 20, paddingBottom: 20, borderBottom: `1px solid ${C.gray100}` }}>
          <label style={S.label}>{t.client_search_lbl}</label>
          <div style={{ position: "relative" }}>
            <input
              ref={searchRef}
              style={{ ...S.input, paddingRight: selectedClient ? 36 : 13 }}
              value={clientSearch}
              onChange={e => { setClientSearch(e.target.value); setShowDropdown(true); setSelectedClient(""); }}
              onFocus={() => setShowDropdown(true)}
              placeholder={t.client_search_ph}
            />
            {selectedClient && (
              <button onClick={() => { setSelectedClient(""); setClientSearch(""); }}
                style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", color: C.gray400, fontSize: 16, lineHeight: 1 }}>✕</button>
            )}
            {showDropdown && clientMatches.length > 0 && (
              <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: C.white, border: `1.5px solid ${C.gray200}`, borderRadius: 10, boxShadow: "0 4px 16px rgba(0,0,0,.1)", zIndex: 100, maxHeight: 200, overflowY: "auto" }}>
                {clientMatches.map(c => {
                  const qDigits = clientSearch.replace(/\D/g, "");
                  const phoneMatch = qDigits.length >= 3 && c.phone.replace(/\D/g, "").includes(qDigits) && !c.name.toLowerCase().includes(clientSearch.toLowerCase());
                  return (
                    <button key={c.id} onClick={() => selectClientFromSearch(c)}
                      style={{ width: "100%", textAlign: "left", background: "none", border: "none", padding: "10px 14px", cursor: "pointer", fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${C.gray100}` }}>
                      <div>
                        <span style={{ fontWeight: 700, color: C.gray800 }}>{c.name}</span>
                        <span style={{ fontWeight: phoneMatch ? 700 : 400, color: phoneMatch ? C.teal : C.gray400, marginLeft: 8 }}>📱 {c.phone}</span>
                      </div>
                      <span style={{ ...S.badge(C.orangeL, C.orangeD), fontSize: 10 }}>{c.loyalty} pts</span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
          {!selectedClient && clientSearch.trim() === "" && (
            <div style={{ marginTop: 10 }}>
              <label style={{ ...S.label, marginBottom: 8 }}>{t.or_select_list}</label>
              <select style={S.input} value={selectedClient} onChange={e => {
                setSelectedClient(e.target.value);
                const c = state.clients.find(x => x.id === Number(e.target.value));
                if (c) setClientSearch(c.name);
              }}>
                <option value="">{t.select_client}</option>
                {state.clients.map(c => <option key={c.id} value={c.id}>{c.name} — {c.phone}</option>)}
              </select>
            </div>
          )}
          {selectedClient && (() => {
            const c = state.clients.find(x => x.id === Number(selectedClient));
            return c ? (
              <div style={{ marginTop: 10, padding: "10px 14px", background: C.tealL, borderRadius: 9, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <span style={{ fontWeight: 700, color: C.tealD }}>{c.name}</span>
                  <span style={{ color: C.teal, marginLeft: 10, fontSize: 12 }}>{c.phone}</span>
                </div>
                <span style={{ ...S.badge(C.orangeL, C.orangeD) }}>{c.loyalty} pts</span>
              </div>
            ) : null;
          })()}
        </div>

        <div style={{ marginBottom: 18 }}>
          <label style={S.label}>{t.services}</label>
          {lines.map((line, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr .55fr .8fr auto", gap: 8, marginBottom: 8, alignItems: "center" }}>
              <select style={S.input} value={line.name} onChange={e => applyService(i, e.target.value)}>
                <option value="">{lang === "es" ? "— Servicio —" : "— Service —"}</option>
                {SERVICE_CATALOG.map(s => <option key={s.name} value={s.name}>{svcLabel(s)} ({fmtCurrency(s.price)})</option>)}
              </select>
              <input type="number" style={S.input} value={line.qty} min={1} onChange={e => updateLine(i, "qty", e.target.value)} placeholder={t.qty} />
              <input type="number" style={S.input} value={line.price} onChange={e => updateLine(i, "price", e.target.value)} placeholder={lang === "es" ? "Precio" : "Price"} />
              <button style={S.btnSm(C.redL, C.red)} onClick={() => removeLine(i)}>✕</button>
            </div>
          ))}
          <button style={{ ...S.btn(C.gray100, C.gray700), fontSize: 12, marginTop: 4 }} onClick={addLine}>{t.add_line}</button>
        </div>

        <Field label={t.note_optional}>
          <input style={S.input} value={invoiceNote} onChange={e => setInvoiceNote(e.target.value)} placeholder={t.internal_note} />
        </Field>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.gray100}` }}>
          <div style={{ fontSize: 22, fontWeight: 900, color: C.orange }}>Total: {fmtCurrency(total)}</div>
          <button style={{ ...S.btn(), padding: "11px 24px" }} onClick={createInvoice}>{t.generate_invoice}</button>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      <PageHeader title={t.pos_title}>
        <input style={{ ...S.input, width: 220 }} value={search} onChange={e => setSearch(e.target.value)} placeholder={t.search_invoice} />
        <button style={S.btn()} onClick={() => setView("new")}>{t.new_invoice}</button>
      </PageHeader>
      <Tabs
        tabs={[{key:"all",label:t.all},{key:"pending",icon:"⏳",label:t.pending},{key:"delivered",icon:"✅",label:t.delivered}]}
        active={filter} onChange={setFilter}
      />
      <div style={S.card}>
        <table style={S.table}>
          <thead><tr>{[t.invoice_num, t.client_col, t.services, t.total, t.date, t.created_by, t.status, t.actions].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {displayed.length === 0 && (
              <tr><td colSpan={8} style={{ ...S.td, textAlign: "center", color: C.gray400, padding: 32 }}>{t.no_invoices}</td></tr>
            )}
            {displayed.map(inv => (
              <tr key={inv.id}>
                <td style={S.td}><b style={{ color: C.orange }}>{inv.id}</b></td>
                <td style={S.td}><b>{inv.clientName}</b></td>
                <td style={{ ...S.td, maxWidth: 180 }}><span style={{ color: C.gray500 }}>{inv.services.map(s => {
                  const ci = SERVICE_CATALOG.find(c => c.name === s.name);
                  return lang === "es" && ci ? (ci.nameEs || s.name) : s.name;
                }).join(", ")}</span></td>
                <td style={{ ...S.td, fontWeight: 700 }}>{fmtCurrency(inv.total)}</td>
                <td style={S.td}>{inv.date}</td>
                <td style={{ ...S.td, fontSize: 12, color: C.gray500 }}>{inv.createdBy}</td>
                <td style={S.td}><Badge type={inv.status} label={inv.status === "delivered" ? t.delivered : t.pending} /></td>
                <td style={S.td}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button style={S.btnSm(C.tealL, C.teal)} onClick={() => { setPrintInv(inv); setView("print"); }}>{t.view}</button>
                    <button
                      style={S.btnSm(inv.status === "delivered" ? C.greenL : C.yellowL, inv.status === "delivered" ? C.green : C.yellow)}
                      onClick={() => dispatch({ type: "UPDATE_INVOICE_STATUS", id: inv.id, status: inv.status === "delivered" ? "pending" : "delivered" })}>
                      {inv.status === "delivered" ? `✓ ${t.delivered}` : `⏳ ${t.pending}`}
                    </button>
                    {(state.currentUser.role === "owner" || state.currentUser.role === "manager") && (
                      <button style={S.btnSm(C.redL, C.red)}
                        onClick={() => { if (confirm(t.confirm_del_invoice)) dispatch({ type: "DELETE_INVOICE", id: inv.id }); }}>{t.del}</button>
                    )}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// CLIENTS
// ═══════════════════════════════════════════════════════════════════════════
function Clients({ state, dispatch, onNewInvoice }) {
  const { lang } = React.useContext(LangCtx);
  const t = T[lang];
  const [mainTab,  setMainTab]  = useState("clients");
  const [view,     setView]     = useState("list");
  const [form,     setForm]     = useState({ name: "", phone: "", email: "", address: "", notes: "" });
  const [editing,  setEditing]  = useState(null);
  const [search,   setSearch]   = useState("");
  const [detail,   setDetail]   = useState(null);
  const [subModal, setSubModal] = useState(null);
  const [subForm,  setSubForm]  = useState({ plan: "monthly", amount: "", startDate: today() });

  const subs = state.subscriptions || [];

  const filtered = state.clients.filter(c =>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    c.phone.includes(search) || c.email.toLowerCase().includes(search.toLowerCase())
  );

  const save = () => {
    if (!form.name || !form.phone) return alert(t.alert_name_phone);
    if (editing) {
      dispatch({ type: "UPDATE_CLIENT", client: { ...editing, ...form } });
    } else {
      dispatch({ type: "ADD_CLIENT", client: { ...form, id: Date.now(), joinDate: today(), loyalty: 0 } });
    }
    setView("list"); setForm({ name: "", phone: "", email: "", address: "", notes: "" }); setEditing(null);
  };

  const startEdit = c => { setEditing(c); setForm({ name: c.name, phone: c.phone, email: c.email, address: c.address, notes: c.notes || "" }); setView("form"); };
  const clientInvoices = id => state.invoices.filter(i => i.clientId === id);
  const planLabel = p => lang === "es" ? (p.labelEs || p.label) : p.label;

  /* ── Subscription helpers ── */
  const effectiveStatus = sub => {
    if (sub.status === "cancelled") return "cancelled";
    if (sub.status === "on_hold")   return "on_hold";
    if (sub.expirationDate < today()) return "expired";
    return "active";
  };
  const daysLeft = sub => Math.ceil((new Date(sub.expirationDate) - new Date(today())) / 86400000);
  const clientSub = id => subs.filter(s => s.clientId === id && s.status !== "cancelled").sort((a,b) => b.id - a.id)[0];

  const SUB_BADGE = {
    active:    [C.greenL,  C.green],
    on_hold:   [C.yellowL, C.yellow],
    expired:   [C.redL,    C.red],
    cancelled: [C.gray200, C.gray500],
  };
  const statusLabel = st => ({ active: t.active_sub, on_hold: t.on_hold_sub, expired: t.expired_sub, cancelled: t.cancelled_sub }[st] || st);

  const addSubscription = () => {
    if (!subForm.amount) return alert(t.alert_fill);
    const plan  = SUB_PLANS.find(p => p.id === subForm.plan);
    const start = subForm.startDate || today();
    const expiry = new Date(start);
    expiry.setDate(expiry.getDate() + plan.days);
    const client = state.clients.find(c => c.id === subModal);
    dispatch({
      type: "ADD_SUBSCRIPTION",
      sub: { id: Date.now(), clientId: subModal, clientName: client.name, plan: subForm.plan,
             amount: Number(subForm.amount), startDate: start,
             expirationDate: expiry.toISOString().split("T")[0],
             status: "active", createdBy: state.currentUser.name },
    });
    setSubModal(null);
    setSubForm({ plan: "monthly", amount: "", startDate: today() });
  };

  const renewSub = sub => {
    const plan  = SUB_PLANS.find(p => p.id === sub.plan);
    const start = today();
    const expiry = new Date(start);
    expiry.setDate(expiry.getDate() + plan.days);
    dispatch({ type: "UPDATE_SUBSCRIPTION", sub: { ...sub, startDate: start, expirationDate: expiry.toISOString().split("T")[0], status: "active" } });
  };

  /* ── Form view ── */
  if (view === "form") return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 22 }}>
        <button style={S.btn(C.gray200, C.gray800)} onClick={() => { setView("list"); setEditing(null); }}>{t.back}</button>
        <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800 }}>{editing ? t.edit_client : t.new_client_title}</h2>
      </div>
      <div style={{ ...S.card, maxWidth: 500 }}>
        {[[t.full_name,"name","text"],[t.phone,"phone","tel"],[t.email,"email","email"],[t.address,"address","text"]].map(([label, field, type]) => (
          <Field key={field} label={label}>
            <input style={S.input} type={type} value={form[field]} onChange={e => setForm(f => ({ ...f, [field]: e.target.value }))} placeholder={label} />
          </Field>
        ))}
        <Field label={t.internal_notes}>
          <input style={S.input} value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} placeholder={t.notes_ph} />
        </Field>
        <button style={{ ...S.btn(), width: "100%", justifyContent: "center", padding: "11px 0" }} onClick={save}>
          {editing ? t.update_client : t.register_client}
        </button>
      </div>
    </div>
  );

  /* ── Main view ── */
  return (
    <div>
      <PageHeader title={t.clients_title}>
        <input style={{ ...S.input, width: 240 }} value={search} onChange={e => setSearch(e.target.value)} placeholder={t.search_clients} />
        {mainTab === "clients" && (
          <button style={S.btn()} onClick={() => { setForm({ name:"",phone:"",email:"",address:"",notes:"" }); setEditing(null); setView("form"); }}>{t.new_client}</button>
        )}
      </PageHeader>

      <Tabs
        tabs={[{ key:"clients", label: t.tab_clients_list }, { key:"subscriptions", label: "🔄 " + t.subscriptions }]}
        active={mainTab} onChange={setMainTab}
      />

      {/* ── Client list ── */}
      {mainTab === "clients" && (
        <div style={S.card}>
          <table style={S.table}>
            <thead>
              <tr>{[t.client_col,t.phone,t.email,t.joined,t.loyalty,t.subscriptions,t.actions].map(h => <th key={h} style={S.th}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {filtered.length === 0 && (
                <tr><td colSpan={7} style={{ ...S.td, textAlign:"center", color:C.gray400, padding:32 }}>{t.no_clients}</td></tr>
              )}
              {filtered.map(c => {
                const sub = clientSub(c.id);
                const es  = sub ? effectiveStatus(sub) : null;
                const [sbg, sfg] = es ? (SUB_BADGE[es] || [C.gray200,C.gray500]) : [];
                return (
                  <tr key={c.id}>
                    <td style={S.td}>
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <Avatar name={c.name} role="employee" size={30} />
                        <div>
                          <button onClick={() => onNewInvoice(c.id)}
                            style={{ background:"none", border:"none", cursor:"pointer", fontWeight:700, color:C.gray800, fontSize:13, padding:0, textDecoration:"underline", textDecorationColor:C.orange, textUnderlineOffset:3 }}>
                            {c.name}
                          </button>
                          {c.notes && <div style={{ fontSize:11, color:C.gray400, marginTop:1 }}>{c.notes}</div>}
                        </div>
                      </div>
                    </td>
                    <td style={S.td}>{c.phone}</td>
                    <td style={{ ...S.td, fontSize:12, color:C.gray500 }}>{c.email}</td>
                    <td style={{ ...S.td, fontSize:12 }}>{c.joinDate}</td>
                    <td style={S.td}><span style={S.badge(C.orangeL, C.orangeD)}>{c.loyalty} pts</span></td>
                    <td style={S.td}>
                      {sub
                        ? <span style={S.badge(sbg, sfg)}>{statusLabel(es)}</span>
                        : <span style={{ fontSize:11, color:C.gray300 }}>—</span>
                      }
                    </td>
                    <td style={S.td}>
                      <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                        <button style={S.btnSm(C.orange)}          onClick={() => onNewInvoice(c.id)}>{t.invoice_btn}</button>
                        <button style={S.btnSm(C.tealL, C.teal)}   onClick={() => setDetail(c)}>{t.history}</button>
                        <button style={S.btnSm(C.gray100,C.gray600)} onClick={() => startEdit(c)}>{t.edit}</button>
                        <button style={S.btnSm(C.purpleL,C.purple)} onClick={() => { setSubModal(c.id); setSubForm({ plan:"monthly", amount:"", startDate:today() }); }}>{t.subscribe}</button>
                        <button style={S.btnSm(C.redL, C.red)}     onClick={() => { if (confirm(t.confirm_del_client)) dispatch({ type:"DELETE_CLIENT", id:c.id }); }}>{t.del}</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* ── Subscriptions tab ── */}
      {mainTab === "subscriptions" && (
        <div>
          {/* Plan Cards Overview */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))", gap:14, marginBottom:24 }}>
            {SUB_PLANS.map(plan=>{
              const activeSubs = subs.filter(s=>s.plan===plan.id && effectiveStatus(s)==="active");
              return (
                <div key={plan.id} style={{ ...S.card, padding:"16px 18px", borderTop:`4px solid ${plan.color}` }}>
                  {plan.badge && <div style={{ fontSize:10, fontWeight:900, color:plan.color, letterSpacing:1, marginBottom:6 }}>{plan.badge}</div>}
                  <div style={{ fontWeight:800, fontSize:14, color:plan.color, marginBottom:4 }}>{plan.label}</div>
                  {plan.lbs && <div style={{ fontSize:12, color:C.gray500, marginBottom:8 }}>Hasta {plan.lbs} lb / mes</div>}
                  <div style={{ fontSize:20, fontWeight:900, color:C.gray900, marginBottom:4 }}>
                    {plan.price>0 ? fmtCurrency(plan.price) : <span style={{ fontSize:14 }}>A Medida</span>}
                    {plan.price>0 && <span style={{ fontSize:11, color:C.gray400, fontWeight:400 }}>/mes</span>}
                  </div>
                  <div style={{ fontSize:12, color:C.gray400 }}>
                    <b style={{ color:plan.color, fontSize:18 }}>{activeSubs.length}</b> {lang==="es"?"suscriptores activos":"active subscribers"}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Subscriber List */}
          <div style={S.card}>
            <div style={{ fontWeight:800, fontSize:14, marginBottom:16, color:C.gray800 }}>📋 {lang==="es"?"Lista de Suscriptores":"Subscriber List"}</div>
            {subs.length===0 ? (
              <div style={{ textAlign:"center", color:C.gray400, padding:48 }}>
                <div style={{ fontSize:40, marginBottom:12 }}>🔄</div>
                <div style={{ fontWeight:700, fontSize:15 }}>{t.no_subscriptions}</div>
              </div>
            ) : (
              <div style={{ display:"grid", gap:12 }}>
                {[...subs].sort((a,b)=>b.id-a.id).map(sub=>{
                  const es  = effectiveStatus(sub);
                  const dl  = daysLeft(sub);
                  const plan = SUB_PLANS.find(p=>p.id===sub.plan);
                  const [sbg,sfg] = SUB_BADGE[es]||[C.gray200,C.gray500];
                  const isLate    = dl < 0;
                  const daysLate  = Math.abs(dl);
                  const dlColor   = dl>7?C.green:dl>0?C.yellow:C.red;

                  return (
                    <div key={sub.id} style={{ ...S.cardSm, border:`1px solid ${isLate&&es!=="cancelled"?C.red+"44":C.gray200}`, background:isLate&&es!=="cancelled"?C.redL+"44":"#fff" }}>
                      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
                        {/* Left: client info */}
                        <div style={{ flex:1, minWidth:160 }}>
                          <div style={{ fontWeight:800, fontSize:15, color:C.gray900, marginBottom:4 }}>{sub.clientName}</div>
                          <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                            <span style={{ fontSize:12, fontWeight:700, color:plan?.color||C.gray500, background:(plan?.colorL||C.gray100), borderRadius:20, padding:"2px 10px" }}>
                              {plan?.label||sub.plan}
                            </span>
                            <span style={S.badge(sbg,sfg)}>{statusLabel(es)}</span>
                            {sub.paid && <span style={S.badge(C.greenL,C.green)}>✅ {lang==="es"?"Pagado":"Paid"}</span>}
                          </div>
                        </div>

                        {/* Middle: dates & amount */}
                        <div style={{ fontSize:12, color:C.gray500, textAlign:"center" }}>
                          <div><b style={{ color:C.gray700 }}>{fmtCurrency(sub.amount)}</b>/mes</div>
                          <div>{lang==="es"?"Inicio:":"Start:"} {sub.startDate}</div>
                          <div>{lang==="es"?"Vence:":"Expires:"} <b style={{ color:plan?.color||C.gray600 }}>{sub.expirationDate}</b></div>
                        </div>

                        {/* Right: days left / late */}
                        <div style={{ textAlign:"center", minWidth:90 }}>
                          {es==="cancelled"||es==="on_hold" ? (
                            <span style={{ color:C.gray400, fontSize:12 }}>—</span>
                          ) : isLate ? (
                            <div>
                              <div style={{ fontSize:20, fontWeight:900, color:C.red }}>{daysLate}d</div>
                              <div style={{ fontSize:10, color:C.red, fontWeight:700 }}>{lang==="es"?"VENCIDO":"OVERDUE"}</div>
                            </div>
                          ) : (
                            <div>
                              <div style={{ fontSize:20, fontWeight:900, color:dlColor }}>{dl}d</div>
                              <div style={{ fontSize:10, color:dlColor, fontWeight:700 }}>{lang==="es"?"RESTANTES":"LEFT"}</div>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Actions */}
                      <div style={{ display:"flex", gap:8, marginTop:12, flexWrap:"wrap" }}>
                        {es!=="cancelled" && (
                          <button style={{ ...S.btnSm(C.greenL,C.green) }} onClick={()=>renewSub(sub)}>
                            🔄 {t.renew}
                          </button>
                        )}
                        {!sub.paid && es!=="cancelled" && (
                          <button style={{ ...S.btnSm(C.tealL,C.teal) }} onClick={()=>dispatch({type:"UPDATE_SUBSCRIPTION",sub:{...sub,paid:true}})}>
                            💳 {lang==="es"?"Marcar Pagado":"Mark Paid"}
                          </button>
                        )}
                        {sub.paid && (
                          <button style={{ ...S.btnSm(C.gray100,C.gray500) }} onClick={()=>dispatch({type:"UPDATE_SUBSCRIPTION",sub:{...sub,paid:false}})}>
                            ↩ {lang==="es"?"Desmarcar Pago":"Unmark Paid"}
                          </button>
                        )}
                        {es==="active" && (
                          <button style={{ ...S.btnSm(C.yellowL,C.yellow) }} onClick={()=>dispatch({type:"UPDATE_SUBSCRIPTION",sub:{...sub,status:"on_hold"}})}>
                            ⏸ {t.hold_sub}
                          </button>
                        )}
                        {es==="on_hold" && (
                          <button style={{ ...S.btnSm(C.tealL,C.teal) }} onClick={()=>dispatch({type:"UPDATE_SUBSCRIPTION",sub:{...sub,status:"active"}})}>
                            ▶ {t.resume_sub}
                          </button>
                        )}
                        {es!=="cancelled" && (
                          <button style={{ ...S.btnSm(C.redL,C.red) }} onClick={()=>{ if(confirm(t.confirm_cancel_sub)) dispatch({type:"UPDATE_SUBSCRIPTION",sub:{...sub,status:"cancelled"}}); }}>
                            ✕ {t.cancel_sub}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── Invoice history modal ── */}
      {detail && (
        <Modal title={`${detail.name} — ${t.invoice_history}`} onClose={() => setDetail(null)} width={580}>
          <div style={{ marginBottom:16, padding:"10px 14px", background:C.gray50, borderRadius:9 }}>
            <div style={{ fontSize:12, color:C.gray500 }}>{detail.phone} · {detail.email}</div>
            <div style={{ fontSize:12, color:C.gray500 }}>{detail.address}</div>
            {detail.notes && <div style={{ fontSize:12, color:C.orange, marginTop:4 }}>📌 {detail.notes}</div>}
          </div>
          <table style={S.table}>
            <thead><tr>{["ID",t.services,t.total,t.date,t.status].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {clientInvoices(detail.id).length === 0 && (
                <tr><td colSpan={5} style={{ ...S.td, textAlign:"center", color:C.gray400 }}>{t.no_invoices_yet}</td></tr>
              )}
              {clientInvoices(detail.id).map(i => (
                <tr key={i.id}>
                  <td style={S.td}><b style={{ color:C.orange, fontSize:12 }}>{i.id}</b></td>
                  <td style={{ ...S.td, fontSize:12, color:C.gray500 }}>{i.services.map(s => s.name).join(", ")}</td>
                  <td style={{ ...S.td, fontWeight:700 }}>{fmtCurrency(i.total)}</td>
                  <td style={S.td}>{i.date}</td>
                  <td style={S.td}><Badge type={i.status} label={i.status === "delivered" ? t.delivered : t.pending} /></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ marginTop:14 }}>
            <button style={{ ...S.btn(), width:"100%" }} onClick={() => { setDetail(null); onNewInvoice(detail.id); }}>
              {t.create_invoice_for} {detail.name}
            </button>
          </div>
        </Modal>
      )}

      {/* ── New subscription modal ── */}
      {subModal && (() => {
        const client = state.clients.find(c => c.id === subModal);
        const plan   = SUB_PLANS.find(p => p.id === subForm.plan);
        const previewExp = subForm.startDate && plan ? (() => { const d=new Date(subForm.startDate); d.setDate(d.getDate()+plan.days); return d.toISOString().split("T")[0]; })() : null;
        return (
          <Modal title={`${t.new_subscription} — ${client?.name}`} onClose={() => setSubModal(null)} width={500}>
            {/* Plan selector cards */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
              {SUB_PLANS.map(p=>(
                <div key={p.id} onClick={()=>setSubForm(f=>({...f,plan:p.id,amount:p.price||""}))}
                  style={{ border:`2px solid ${subForm.plan===p.id?p.color:C.gray200}`, borderRadius:12, padding:"12px 14px", cursor:"pointer", background:subForm.plan===p.id?p.colorL:"#fff", transition:"all 0.2s" }}>
                  {p.badge && <div style={{ fontSize:9, fontWeight:900, color:p.color, letterSpacing:1 }}>{p.badge}</div>}
                  <div style={{ fontWeight:800, fontSize:13, color:p.color }}>{p.label}</div>
                  {p.lbs && <div style={{ fontSize:11, color:C.gray500 }}>Hasta {p.lbs} lb</div>}
                  <div style={{ fontSize:15, fontWeight:900, color:C.gray900, marginTop:4 }}>
                    {p.price>0?fmtCurrency(p.price):"A Medida"}
                    {p.price>0&&<span style={{ fontSize:10, color:C.gray400 }}>/mes</span>}
                  </div>
                  <div style={{ marginTop:6 }}>
                    {p.features.slice(0,3).map((f,i)=><div key={i} style={{ fontSize:10, color:C.gray600 }}>✓ {f}</div>)}
                  </div>
                </div>
              ))}
            </div>

            <Field label={t.sub_amount}>
              <input style={S.input} type="number" value={subForm.amount}
                onChange={e=>setSubForm(f=>({...f,amount:e.target.value}))}
                placeholder={plan?.price>0?`RD$${plan.price}`:"Precio negociado"} />
            </Field>
            <Field label={t.start_date}>
              <input style={S.input} type="date" value={subForm.startDate}
                onChange={e=>setSubForm(f=>({...f,startDate:e.target.value}))} />
            </Field>
            {previewExp && (
              <div style={{ background:C.purpleL, borderRadius:9, padding:"10px 14px", marginBottom:14, fontSize:12, color:C.purple, fontWeight:700 }}>
                📅 {t.expiration}: <b>{previewExp}</b> &nbsp;·&nbsp; {plan.days} {t.sub_days}
              </div>
            )}
            <button style={{ ...S.btn(), background:plan?.color||C.orange, width:"100%", justifyContent:"center", padding:"11px 0" }} onClick={addSubscription}>
              {t.save_subscription}
            </button>
          </Modal>
        );
      })()}
    </div>
  );
}

            {myShifts.length === 0 && <tr><td colSpan={5} style={{ ...S.td, textAlign: "center", color: C.gray400, padding: 32 }}>{t.no_shifts}</td></tr>}

              <tr key={s.id}>

  );
}
