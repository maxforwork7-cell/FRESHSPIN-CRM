// ACCOUNTING
// ═══════════════════════════════════════════════════════════════════════════
const EXP_CATS = ["Utilities","Supplies","Maintenance","Salaries","Rent","Marketing","Insurance","Equipment","Other"];

function Accounting({ state, dispatch }) {
  const { lang } = React.useContext(LangCtx);
  const t = T[lang];
  const [tab,       setTab]      = useState("overview");
  const [period,    setPeriod]   = useState("all");
  const [expForm,   setExpForm]  = useState({ category:"Utilities", description:"", amount:"", date:today() });
  const [showForm,  setShowForm] = useState(false);
  const [proofFile, setProofFile]   = useState(null);
  const [proofViewer, setProofViewer] = useState(null);

  // ── Period filter helper ──────────────────────────────────────────────────
  const filterByPeriod = (items, dateKey) => {
    const now = new Date();
    return items.filter(item => {
      const d = new Date(item[dateKey]);
      if(period==="today") {
        return d.toDateString()===now.toDateString();
      }
      if(period==="week") {
        const s=new Date(now); s.setDate(now.getDate()-now.getDay()); s.setHours(0,0,0,0);
        return d>=s;
      }
      if(period==="month") return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
      return true; // "all"
    });
  };

  const periodLabels = {
    en: { all:"All Time", month:"This Month", week:"This Week", today:"Today" },
    es: { all:"Todo",     month:"Este Mes",   week:"Esta Semana", today:"Hoy" },
  };
  const PL = periodLabels[lang]||periodLabels.en;

  const paidInvs = filterByPeriod(state.invoices.filter(i=>i.status==="delivered"), "date");
  const filteredExpenses = filterByPeriod(state.expenses, "date");
  const revenue  = paidInvs.reduce((s,i)=>s+i.total,0);
  const expenses = filteredExpenses.reduce((s,e)=>s+e.amount,0);
  const profit   = revenue - expenses;

  // Monthly overview always uses all data (for the table/chart)
  const allPaidInvs = state.invoices.filter(i=>i.status==="delivered");
  const months = {};
  allPaidInvs.forEach(i  => { const m=i.date.slice(0,7); if(!months[m]) months[m]={rev:0,exp:0}; months[m].rev+=i.total; });
  state.expenses.forEach(e => { const m=e.date.slice(0,7); if(!months[m]) months[m]={rev:0,exp:0}; months[m].exp+=e.amount; });

  const allMonths = Object.keys(months).sort();
  const expByCatMonth = {};
  state.expenses.forEach(e => {
    const m = e.date.slice(0,7);
    if(!expByCatMonth[e.category]) expByCatMonth[e.category]={};
    expByCatMonth[e.category][m]=(expByCatMonth[e.category][m]||0)+e.amount;
  });
  const expCategories = Object.keys(expByCatMonth);
  const fmtMonth = m => { const [yr,mo]=m.split("-"); return new Date(+yr,+mo-1).toLocaleString(lang==="es"?"es-DO":"en-US",{month:"short",year:"2-digit"}); };

  const handleProof = ev => {
    const file=ev.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>setProofFile({name:file.name,type:file.type,data:e.target.result});
    reader.readAsDataURL(file);
  };

  const addExpense = () => {
    if(!expForm.description||!expForm.amount) return alert(t.alert_fill);
    dispatch({type:"ADD_EXPENSE",expense:{...expForm,id:Date.now(),amount:Number(expForm.amount),createdBy:state.currentUser.name,proof:proofFile||null}});
    setExpForm({category:"Utilities",description:"",amount:"",date:today()});
    setProofFile(null); setShowForm(false);
  };

  const canAddExpense = state.currentUser.role==="owner"||state.currentUser.role==="manager";

  const downloadExcel = () => {
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
      ["FRESHSPIN DRY & LAUNDRY – PROFIT & LOSS SUMMARY"],
      [`Report generated: ${today()}`],[],
      ["Line Item",...allMonths.map(fmtMonth),"Annual Total"],
      ["TOTAL REVENUE",...allMonths.map(m=>months[m]?.rev||0),allPaidInvs.reduce((s,i)=>s+i.total,0)],
      ["TOTAL EXPENSES",...allMonths.map(m=>months[m]?.exp||0),state.expenses.reduce((s,e)=>s+e.amount,0)],
      ["GROSS PROFIT",...allMonths.map(m=>(months[m]?.rev||0)-(months[m]?.exp||0)),(allPaidInvs.reduce((s,i)=>s+i.total,0)-state.expenses.reduce((s,e)=>s+e.amount,0))],
    ]),"P&L Summary");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
      ["FRESHSPIN DRY & LAUNDRY – INCOME DETAIL"],[`Report generated: ${today()}`],[],
      ["Invoice #","Client","Services","Amount (RD$)","Date","Created By"],
      ...allPaidInvs.map(i=>[i.id,i.clientName,i.services.map(s=>s.name).join(", "),i.total,i.date,i.createdBy]),
      [],["TOTAL","","",allPaidInvs.reduce((s,i)=>s+i.total,0),"",""],
    ]),"Income Detail");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
      ["FRESHSPIN DRY & LAUNDRY – EXPENSE DETAIL"],[`Report generated: ${today()}`],[],
      ["Category","Description","Amount (RD$)","Date","Recorded By"],
      ...state.expenses.map(e=>[e.category,e.description,e.amount,e.date,e.createdBy]),
      [],["TOTAL","",state.expenses.reduce((s,e)=>s+e.amount,0),"",""],
    ]),"Expense Detail");
    XLSX.writeFile(wb,`FreshSpin_Report_${today()}.xlsx`);
  };

  const periodBtn = (key,label) => (
    <button key={key} onClick={()=>setPeriod(key)} style={{
      padding:"6px 14px", borderRadius:20, border:"none", cursor:"pointer",
      fontWeight:700, fontSize:12,
      background: period===key ? C.orange : C.gray100,
      color:       period===key ? "#fff"   : C.gray600,
      transition:"all 0.2s",
    }}>{label}</button>
  );

  return (
    <div>
      <PageHeader title={t.accounting_title}>
        {canAddExpense && <>
          <button style={S.btn(C.tealL,C.tealD)} onClick={downloadExcel}>{t.excel_report}</button>
          <button style={S.btn()} onClick={()=>setShowForm(true)}>{t.record_expense}</button>
        </>}
      </PageHeader>

      {/* Period Filter */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"flex-end", marginBottom:16, gap:6, background:C.gray50, padding:4, borderRadius:24, width:"fit-content", marginLeft:"auto", border:`1px solid ${C.gray200}` }}>
        {periodBtn("all",   PL.all)}
        {periodBtn("month", PL.month)}
        {periodBtn("week",  PL.week)}
        {periodBtn("today", PL.today)}
      </div>

      {/* Stat Cards */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14, marginBottom:22 }}>
        <StatCard label={t.total_revenue}  value={fmtCurrency(revenue)}  icon="💰" color={C.green} />
        <StatCard label={t.total_expenses} value={fmtCurrency(expenses)} icon="📉" color={C.red} />
        <StatCard label={t.net_profit}     value={fmtCurrency(profit)}   icon="📈" color={profit>=0?C.orange:C.red} />
      </div>

      <Tabs
        tabs={[{key:"overview",label:t.tab_monthly},{key:"income",label:t.tab_income},{key:"expenses",label:t.tab_expenses},{key:"report",label:t.tab_report}]}
        active={tab} onChange={setTab}
      />

      {tab === "overview" && (
        <div style={S.card}>
          <table style={S.table}>
            <thead><tr>{[t.month,t.revenue,t.expenses_col,t.net_profit,t.margin].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {Object.entries(months).sort((a,b) => b[0].localeCompare(a[0])).map(([m, d]) => {
                const p = d.rev - d.exp;
                return (
                  <tr key={m}>
                    <td style={{ ...S.td, fontWeight: 700 }}>{m}</td>
                    <td style={{ ...S.td, color: C.green,  fontWeight: 700 }}>{fmtCurrency(d.rev)}</td>
                    <td style={{ ...S.td, color: C.red,    fontWeight: 700 }}>{fmtCurrency(d.exp)}</td>
                    <td style={{ ...S.td, color: p >= 0 ? C.green : C.red, fontWeight: 700 }}>{fmtCurrency(p)}</td>
                    <td style={S.td}><Badge type={d.rev > 0 ? "active" : "inactive"} label={d.rev > 0 ? ((d.rev - d.exp)/d.rev*100).toFixed(1)+"%" : "—"} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {tab === "income" && (
        <div style={S.card}>
          <table style={S.table}>
            <thead><tr>{[t.invoice_num,t.client_col,t.services,t.amount,t.date,t.created_by].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {paidInvs.map(i => (
                <tr key={i.id}>
                  <td style={S.td}><b style={{ color: C.orange, fontSize: 12 }}>{i.id}</b></td>
                  <td style={S.td}><b>{i.clientName}</b></td>
                  <td style={{ ...S.td, fontSize: 12, color: C.gray500 }}>{i.services.map(s => s.name).join(", ")}</td>
                  <td style={{ ...S.td, color: C.green, fontWeight: 700 }}>{fmtCurrency(i.total)}</td>
                  <td style={S.td}>{i.date}</td>
                  <td style={{ ...S.td, fontSize: 12 }}>{i.createdBy}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab === "expenses" && (
        <div style={S.card}>
          <table style={S.table}>
            <thead><tr>{[t.category,t.description,t.amount,t.date,t.recorded_by,t.proof,""].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {[...filteredExpenses].reverse().map(e => (
                <tr key={e.id}>
                  <td style={S.td}><Badge type="pending" label={e.category} /></td>
                  <td style={S.td}>{e.description}</td>
                  <td style={{ ...S.td, color: C.red, fontWeight: 700 }}>{fmtCurrency(e.amount)}</td>
                  <td style={S.td}>{e.date}</td>
                  <td style={{ ...S.td, fontSize: 12, color: C.gray500 }}>{e.createdBy}</td>
                  <td style={S.td}>
                    {e.proof
                      ? <button style={S.btnSm(C.tealL, C.teal)} onClick={() => setProofViewer(e.proof)}>{"📎 " + t.view}</button>
                      : <span style={{ fontSize: 11, color: C.gray300 }}>—</span>
                    }
                  </td>
                  <td style={S.td}>
                    {canAddExpense && (
                      <button style={S.btnSm(C.redL, C.red)} onClick={() => { if (confirm(t.confirm_del_expense)) dispatch({ type: "DELETE_EXPENSE", id: e.id }); }}>{t.del}</button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab === "report" && (
        <div>
          <div style={{ ...S.card, marginBottom: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 800, color: C.gray400, textTransform: "uppercase", letterSpacing: "0.08em" }}>{t.freshspin_lbl}</div>
                <h3 style={{ margin: "2px 0 0", fontSize: 15, fontWeight: 800, color: C.gray900 }}>{t.pl_summary}</h3>
              </div>
              <span style={{ fontSize: 11, color: C.gray400 }}>{t.generated} {today()}</span>
            </div>
            {allMonths.length === 0 ? (
              <div style={{ textAlign: "center", color: C.gray400, padding: 32 }}>{t.no_data}</div>
            ) : (
              <div style={{ overflowX: "auto" }}>
                <table style={S.table}>
                  <thead>
                    <tr>
                      <th style={{ ...S.th, minWidth: 170 }}>{t.line_item}</th>
                      {allMonths.map(m => <th key={m} style={{ ...S.th, textAlign: "right" }}>{fmtMonth(m)}</th>)}
                      <th style={{ ...S.th, textAlign: "right", borderLeft: `2px solid ${C.gray200}` }}>{t.annual_total}</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style={{ background: C.greenL + "55" }}>
                      <td style={{ ...S.td, fontWeight: 800, color: C.green }}>{t.row_revenue}</td>
                      {allMonths.map(m => <td key={m} style={{ ...S.td, textAlign: "right", color: C.green, fontWeight: 700 }}>{fmtCurrency(months[m]?.rev || 0)}</td>)}
                      <td style={{ ...S.td, textAlign: "right", fontWeight: 900, color: C.green, background: C.gray50, borderLeft: `2px solid ${C.gray200}` }}>{fmtCurrency(revenue)}</td>
                    </tr>
                    <tr style={{ background: C.redL + "55" }}>
                      <td style={{ ...S.td, fontWeight: 800, color: C.red }}>{t.row_expenses}</td>
                      {allMonths.map(m => <td key={m} style={{ ...S.td, textAlign: "right", color: C.red, fontWeight: 700 }}>{fmtCurrency(months[m]?.exp || 0)}</td>)}
                      <td style={{ ...S.td, textAlign: "right", fontWeight: 900, color: C.red, background: C.gray50, borderLeft: `2px solid ${C.gray200}` }}>{fmtCurrency(expenses)}</td>
                    </tr>
                    <tr style={{ borderTop: `2px solid ${profit >= 0 ? C.green : C.red}` }}>
                      <td style={{ ...S.td, fontWeight: 800, color: profit >= 0 ? C.green : C.red }}>{t.row_profit}</td>
                      {allMonths.map(m => { const p = (months[m]?.rev||0)-(months[m]?.exp||0); return <td key={m} style={{ ...S.td, textAlign: "right", color: p >= 0 ? C.green : C.red, fontWeight: 700 }}>{fmtCurrency(p)}</td>; })}
                      <td style={{ ...S.td, textAlign: "right", fontWeight: 900, color: profit >= 0 ? C.green : C.red, background: C.gray50, borderLeft: `2px solid ${C.gray200}` }}>{fmtCurrency(profit)}</td>
                    </tr>
                    <tr>
                      <td style={{ ...S.td, fontWeight: 700, color: C.gray600 }}>{t.row_margin}</td>
                      {allMonths.map(m => { const r = months[m]?.rev||0, p = r-(months[m]?.exp||0); return <td key={m} style={{ ...S.td, textAlign: "right", fontWeight: 700, color: r > 0 ? (p >= 0 ? C.green : C.red) : C.gray400 }}>{r > 0 ? (p/r*100).toFixed(1)+"%" : "—"}</td>; })}
                      <td style={{ ...S.td, textAlign: "right", fontWeight: 900, background: C.gray50, borderLeft: `2px solid ${C.gray200}`, color: revenue > 0 ? (profit >= 0 ? C.green : C.red) : C.gray400 }}>{revenue > 0 ? (profit/revenue*100).toFixed(1)+"%" : "—"}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {expCategories.length > 0 && (
            <div style={S.card}>
              <h3 style={{ margin: "0 0 16px", fontSize: 15, fontWeight: 800, color: C.gray900 }}>{t.monthly_breakdown}</h3>
              <div style={{ overflowX: "auto" }}>
                <table style={S.table}>
                  <thead>
                    <tr>
                      <th style={{ ...S.th, minWidth: 160 }}>{t.category}</th>
                      {allMonths.map(m => <th key={m} style={{ ...S.th, textAlign: "right" }}>{fmtMonth(m)}</th>)}
                      <th style={{ ...S.th, textAlign: "right", borderLeft: `2px solid ${C.gray200}` }}>{t.total}</th>
                    </tr>
                  </thead>
                  <tbody>
                    {expCategories.map(cat => {
                      const catTotal = Object.values(expByCatMonth[cat]).reduce((s,v) => s+v, 0);
                      return (
                        <tr key={cat}>
                          <td style={S.td}><Badge type="pending" label={cat} /></td>
                          {allMonths.map(m => <td key={m} style={{ ...S.td, textAlign: "right" }}>{expByCatMonth[cat]?.[m] ? fmtCurrency(expByCatMonth[cat][m]) : <span style={{ color: C.gray300 }}>—</span>}</td>)}
                          <td style={{ ...S.td, textAlign: "right", fontWeight: 700, color: C.red, background: C.gray50, borderLeft: `2px solid ${C.gray200}` }}>{fmtCurrency(catTotal)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr style={{ borderTop: `2px solid ${C.gray200}`, background: C.gray50 }}>
                      <td style={{ ...S.td, fontWeight: 800 }}>{t.total_monthly}</td>
                      {allMonths.map(m => <td key={m} style={{ ...S.td, textAlign: "right", fontWeight: 800, color: C.red }}>{fmtCurrency(months[m]?.exp || 0)}</td>)}
                      <td style={{ ...S.td, textAlign: "right", fontWeight: 900, color: C.red, borderLeft: `2px solid ${C.gray200}` }}>{fmtCurrency(expenses)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          )}
        </div>
      )}

      {showForm && (
        <Modal title={t.record_new_expense} onClose={() => { setShowForm(false); setProofFile(null); }} width={440}>
          <Field label={t.category}>
            <select style={S.input} value={expForm.category} onChange={e => setExpForm(f => ({ ...f, category: e.target.value }))}>
              {EXP_CATS.map(c => <option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label={t.description}>
            <input style={S.input} value={expForm.description} onChange={e => setExpForm(f => ({ ...f, description: e.target.value }))} placeholder="e.g. Monthly electricity" />
          </Field>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <Field label={t.amount_rd}>
              <input style={S.input} type="number" value={expForm.amount} onChange={e => setExpForm(f => ({ ...f, amount: e.target.value }))} placeholder="0" />
            </Field>
            <Field label={t.date}>
              <input style={S.input} type="date" value={expForm.date} onChange={e => setExpForm(f => ({ ...f, date: e.target.value }))} />
            </Field>
          </div>
          <Field label={t.proof_optional}>
            <label style={{ display: "flex", alignItems: "center", gap: 12, cursor: "pointer", border: `1.5px dashed ${C.gray300}`, borderRadius: 9, padding: "12px 14px", background: C.gray50 }}>
              <span style={{ fontSize: 22 }}>📎</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.gray700 }}>{proofFile ? proofFile.name : t.attach_file}</div>
                <div style={{ fontSize: 11, color: C.gray400 }}>{proofFile ? t.click_to_replace : t.file_types}</div>
              </div>
              <input type="file" accept="image/*,.pdf" onChange={handleProof} style={{ display: "none" }} />
            </label>
            {proofFile && (
              <div style={{ marginTop: 8, padding: "6px 12px", background: C.tealL, borderRadius: 7, fontSize: 12, color: C.tealD, display: "flex", alignItems: "center", gap: 6 }}>
                ✓ <b>{proofFile.name}</b> {t.ready_to_attach}
              </div>
            )}
          </Field>
          <button style={{ ...S.btn(), width: "100%", justifyContent: "center", padding: "11px 0" }} onClick={addExpense}>
            {t.record_expense_btn}
          </button>
        </Modal>
      )}

      {proofViewer && (
        <Modal title={t.proof_title} onClose={() => setProofViewer(null)} width={600}>
          <div style={{ textAlign: "center" }}>
            {proofViewer.type === "application/pdf" ? (
              <div>
                <div style={{ marginBottom: 12, fontSize: 13, color: C.gray600 }}>📄 {proofViewer.name}</div>
                <a href={proofViewer.data} download={proofViewer.name} style={{ ...S.btn(C.teal), display: "inline-flex", textDecoration: "none" }}>{t.download_pdf}</a>
                <p style={{ marginTop: 12, fontSize: 11, color: C.gray400 }}>{t.pdf_note}</p>
              </div>
            ) : (
              <div>
                <div style={{ marginBottom: 10, fontSize: 12, color: C.gray500 }}>{proofViewer.name}</div>
                <img src={proofViewer.data} alt="expense proof" style={{ maxWidth: "100%", maxHeight: 400, borderRadius: 9, border: `1px solid ${C.gray200}` }} />
              </div>
            )}
          </div>
        </Modal>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// HR & PAYROLL
// ═══════════════════════════════════════════════════════════════════════════
function HR({ state, dispatch }) {
  const { lang } = React.useContext(LangCtx);
  const t = T[lang];
  const [tab, setTab]             = useState("shifts");
  const [shiftForm, setShiftForm] = useState({ employeeId:"", date:today(), start:"08:00", end:"16:00" });
  const [showShiftForm, setShowShiftForm] = useState(false);
  const [empRates, setEmpRates]   = useState({});
  const [editRates, setEditRates] = useState({});

  // Load per-employee rates from localStorage
  React.useEffect(()=>{
    try{ const r=JSON.parse(localStorage.getItem("fs_emp_rates")||"{}"); setEmpRates(r); }catch(e){}
  },[]);

  const saveRates = updated => {
    setEmpRates(updated);
    localStorage.setItem("fs_emp_rates", JSON.stringify(updated));
  };

  const employees = state.users.filter(u => ["employee","team_lead","driver","manager","owner"].includes(u.role) && u.active !== false);

  const calcHours = (s, e) => {
    const [sh,sm]=s.split(":").map(Number), [eh,em]=e.split(":").map(Number);
    return Math.max(0,(eh*60+em-sh*60-sm)/60);
  };

  const addShift = () => {
    const emp = employees.find(e => e.id === Number(shiftForm.employeeId));
    if(!emp||!shiftForm.date) return alert(lang==="es"?"Selecciona empleado y fecha.":"Select employee and date.");
    const hours = calcHours(shiftForm.start, shiftForm.end);
    dispatch({ type:"ADD_SHIFT", shift:{ id:Date.now(), employeeId:emp.id, employeeName:emp.name, date:shiftForm.date, start:shiftForm.start, end:shiftForm.end, hours, status:"scheduled" }});
    setShiftForm({ employeeId:"", date:today(), start:"08:00", end:"16:00" });
    setShowShiftForm(false);
  };

  // Get rate for employee — use individual rate if set, else global rate
  const getRate = emp => Number(empRates[emp.id+"_rate"] ?? state.hrConfig.hourlyRate);
  const getOT   = emp => Number(empRates[emp.id+"_ot"]   ?? state.hrConfig.overtimeMultiplier);

  const payroll = employees.map(emp => {
    const empShifts  = state.shifts.filter(s => s.employeeId===emp.id && s.status==="completed");
    const totalHours = empShifts.reduce((s,sh)=>s+sh.hours,0);
    const regular    = Math.min(totalHours, 80);
    const overtime   = Math.max(0, totalHours-80);
    const rate       = getRate(emp);
    const otMult     = getOT(emp);
    const gross      = regular*rate + overtime*rate*otMult;
    return { ...emp, totalHours, regular, overtime, gross, rate, otMult };
  });

  const roleLabels = { manager:"Manager", team_lead:"Team Lead", employee:"Employee", driver:"Driver", owner:"Owner" };

  return (
    <div>
      <PageHeader title={t.hr_title}>
        {tab==="shifts" && <button style={S.btn()} onClick={()=>setShowShiftForm(true)}>{t.schedule_shift}</button>}
      </PageHeader>

      <Tabs tabs={[{key:"shifts",label:t.tab_shifts},{key:"payroll",label:t.tab_payroll},{key:"config",label:t.tab_cfg}]} active={tab} onChange={setTab} />

      {/* ── SHIFTS TAB ── */}
      {tab==="shifts" && (
        <div style={S.card}>
          <table style={S.table}>
            <thead><tr>{[t.employee,t.date,t.start,t.end,t.hours,t.status,t.actions].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
            <tbody>
              {[...state.shifts].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>(
                <tr key={s.id}>
                  <td style={S.td}><div style={{ display:"flex", alignItems:"center", gap:8 }}><Avatar name={s.employeeName} role="employee" size={28} /><b>{s.employeeName}</b></div></td>
                  <td style={S.td}>{s.date}</td>
                  <td style={S.td}>{s.start}</td>
                  <td style={S.td}>{s.end}</td>
                  <td style={{ ...S.td, fontWeight:700, color:C.orange }}>{s.hours}h</td>
                  <td style={S.td}><Badge type={s.status} /></td>
                  <td style={S.td}>
                    <div style={{ display:"flex", gap:6 }}>
                      {s.status==="scheduled" && <button style={S.btnSm(C.greenL,C.green)} onClick={()=>dispatch({type:"UPDATE_SHIFT",shift:{...s,status:"completed"}})}>{t.done_btn}</button>}
                      <button style={S.btnSm(C.redL,C.red)} onClick={()=>dispatch({type:"DELETE_SHIFT",id:s.id})}>{t.del}</button>
                    </div>
                  </td>
                </tr>
              ))}
              {state.shifts.length===0 && <tr><td colSpan={7} style={{ ...S.td, textAlign:"center", color:C.gray400, padding:32 }}>{t.no_shifts}</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {/* ── PAYROLL TAB ── */}
      {tab==="payroll" && (
        <div>
          <div style={{ ...S.cardSm, marginBottom:14, background:C.orangeL, border:`1px solid ${C.orange}44` }}>
            <span style={{ fontSize:13, color:C.gray600 }}>
              {lang==="es"?"Tarifa base global:":"Global base rate:"} <b style={{ color:C.orangeD }}>{fmtCurrency(state.hrConfig.hourlyRate)}/hr</b> &nbsp;·&nbsp;
              {lang==="es"?"Período:":"Period:"} <b style={{ color:C.orangeD }}>{state.hrConfig.payPeriod}</b> &nbsp;·&nbsp;
              {lang==="es"?"Las tarifas individuales tienen prioridad":"Individual rates override global"}
            </span>
          </div>
          <div style={S.card}>
            <table style={S.table}>
              <thead><tr>{[t.employee,t.role,lang==="es"?"Tarifa/hr":"Rate/hr",t.total_hours,t.regular,t.overtime,t.gross_pay,""].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
              <tbody>
                {payroll.map(p=>(
                  <tr key={p.id}>
                    <td style={S.td}><div style={{ display:"flex", alignItems:"center", gap:8 }}><Avatar name={p.name} role={p.role} size={28} /><b>{p.name}</b></div></td>
                    <td style={S.td}><Badge type={p.role} label={roleLabels[p.role]||p.role} /></td>
                    <td style={S.td}><b style={{ color:C.teal }}>{fmtCurrency(p.rate)}</b></td>
                    <td style={S.td}>{p.totalHours}h</td>
                    <td style={S.td}>{p.regular}h</td>
                    <td style={S.td}>{p.overtime}h {p.overtime>0&&<Badge type="pending" label="OT" />}</td>
                    <td style={{ ...S.td, fontWeight:900, fontSize:15, color:C.green }}>{fmtCurrency(p.gross)}</td>
                    <td style={S.td}>
                      <button style={S.btnSm(C.tealL,C.teal)} onClick={()=>{
                        const msg = lang==="es"
                          ? `Recibo de Pago — ${p.name}\nRol: ${roleLabels[p.role]||p.role}\nTarifa: ${fmtCurrency(p.rate)}/hr\n\nRegular: ${p.regular}h × ${fmtCurrency(p.rate)} = ${fmtCurrency(p.regular*p.rate)}\nHoras Extra: ${p.overtime}h × ${fmtCurrency(p.rate*p.otMult)} = ${fmtCurrency(p.overtime*p.rate*p.otMult)}\n\nTOTAL BRUTO: ${fmtCurrency(p.gross)}`
                          : `Pay Slip — ${p.name}\nRole: ${roleLabels[p.role]||p.role}\nRate: ${fmtCurrency(p.rate)}/hr\n\nRegular: ${p.regular}h × ${fmtCurrency(p.rate)} = ${fmtCurrency(p.regular*p.rate)}\nOvertime: ${p.overtime}h × ${fmtCurrency(p.rate*p.otMult)} = ${fmtCurrency(p.overtime*p.rate*p.otMult)}\n\nGROSS: ${fmtCurrency(p.gross)}`;
                        alert(msg);
                      }}>{t.pay_slip}</button>
                    </td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr>
                  <td colSpan={6} style={{ ...S.td, fontWeight:700, textAlign:"right", color:C.gray600 }}>{t.total_payroll}</td>
                  <td style={{ ...S.td, fontWeight:900, fontSize:16, color:C.red }}>{fmtCurrency(payroll.reduce((s,p)=>s+p.gross,0))}</td>
                  <td style={S.td}></td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      )}

      {/* ── CONFIG TAB — per employee ── */}
      {tab==="config" && (
        <div>
          {/* Global defaults */}
          <div style={{ ...S.card, maxWidth:480, marginBottom:24 }}>
            <h3 style={{ margin:"0 0 4px", fontSize:15, fontWeight:800 }}>🌐 {lang==="es"?"Configuración Global (Por Defecto)":"Global Defaults"}</h3>
            <p style={{ margin:"0 0 18px", fontSize:12, color:C.gray500 }}>{lang==="es"?"Se aplica a empleados sin tarifa individual configurada.":"Applied to employees without individual rates set."}</p>
            <Field label={lang==="es"?"Tarifa por hora (RD$)":t.hourly_rate}>
              <input style={S.input} type="number" defaultValue={state.hrConfig.hourlyRate}
                onBlur={e=>dispatch({type:"UPDATE_HR_CONFIG",config:{hourlyRate:Number(e.target.value)}})} />
            </Field>
            <Field label={t.overtime_mult}>
              <input style={S.input} type="number" step="0.1" defaultValue={state.hrConfig.overtimeMultiplier}
                onBlur={e=>dispatch({type:"UPDATE_HR_CONFIG",config:{overtimeMultiplier:Number(e.target.value)}})} />
            </Field>
            <Field label={t.pay_period}>
              <select style={S.input} defaultValue={state.hrConfig.payPeriod}
                onChange={e=>dispatch({type:"UPDATE_HR_CONFIG",config:{payPeriod:e.target.value}})}>
                {["weekly","biweekly","monthly"].map(p=><option key={p}>{p}</option>)}
              </select>
            </Field>
          </div>

          {/* Per-employee rates */}
          <div style={S.card}>
            <h3 style={{ margin:"0 0 4px", fontSize:15, fontWeight:800 }}>👤 {lang==="es"?"Tarifas Individuales por Empleado":"Individual Employee Rates"}</h3>
            <p style={{ margin:"0 0 20px", fontSize:12, color:C.gray500 }}>{lang==="es"?"Configura la tarifa y multiplicador de horas extra por empleado. Deja vacío para usar la tarifa global.":"Set individual hourly rate and overtime multiplier per employee. Leave blank to use global rate."}</p>
            <div style={{ display:"grid", gap:12 }}>
              {employees.map(emp=>(
                <div key={emp.id} style={{ ...S.cardSm, display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
                  <Avatar name={emp.name} role={emp.role} size={40} />
                  <div style={{ minWidth:120 }}>
                    <div style={{ fontWeight:800, fontSize:14 }}>{emp.name}</div>
                    <div style={{ fontSize:11, color:C.gray400 }}>{roleLabels[emp.role]||emp.role}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flex:1, flexWrap:"wrap" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <span style={{ fontSize:12, color:C.gray500, whiteSpace:"nowrap" }}>💰 {lang==="es"?"Tarifa/hr:":"Rate/hr:"}</span>
                      <input style={{ ...S.input, width:100, padding:"6px 10px" }} type="number" min="0"
                        placeholder={String(state.hrConfig.hourlyRate)}
                        value={editRates[emp.id+"_rate"]!==undefined ? editRates[emp.id+"_rate"] : (empRates[emp.id+"_rate"]||"")}
                        onChange={e=>setEditRates(r=>({...r,[emp.id+"_rate"]:e.target.value}))} />
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <span style={{ fontSize:12, color:C.gray500, whiteSpace:"nowrap" }}>⏱ OT ×</span>
                      <input style={{ ...S.input, width:70, padding:"6px 10px" }} type="number" min="1" step="0.1"
                        placeholder={String(state.hrConfig.overtimeMultiplier)}
                        value={editRates[emp.id+"_ot"]!==undefined ? editRates[emp.id+"_ot"] : (empRates[emp.id+"_ot"]||"")}
                        onChange={e=>setEditRates(r=>({...r,[emp.id+"_ot"]:e.target.value}))} />
                    </div>
                    <button style={{ ...S.btn(C.tealL,C.teal), padding:"7px 16px" }} onClick={()=>{
                      const updated={...empRates};
                      if(editRates[emp.id+"_rate"]!==undefined && editRates[emp.id+"_rate"]!=="") updated[emp.id+"_rate"]=Number(editRates[emp.id+"_rate"]);
                      else delete updated[emp.id+"_rate"];
                      if(editRates[emp.id+"_ot"]!==undefined && editRates[emp.id+"_ot"]!=="") updated[emp.id+"_ot"]=Number(editRates[emp.id+"_ot"]);
                      else delete updated[emp.id+"_ot"];
                      saveRates(updated);
                      setEditRates(r=>{const n={...r};delete n[emp.id+"_rate"];delete n[emp.id+"_ot"];return n;});
                    }}>{lang==="es"?"Guardar":"Save"}</button>
                    {(empRates[emp.id+"_rate"]||empRates[emp.id+"_ot"]) && (
                      <button style={{ ...S.btnSm(C.redL,C.red) }} onClick={()=>{
                        const updated={...empRates};
                        delete updated[emp.id+"_rate"]; delete updated[emp.id+"_ot"];
                        saveRates(updated);
                      }}>{lang==="es"?"Limpiar":"Clear"}</button>
                    )}
                  </div>
                  <div style={{ textAlign:"center", minWidth:80 }}>
                    <div style={{ fontSize:15, fontWeight:900, color: empRates[emp.id+"_rate"]?C.orange:C.gray400 }}>
                      {fmtCurrency(getRate(emp))}/hr
                    </div>
                    <div style={{ fontSize:10, color:C.gray400 }}>
                      {empRates[emp.id+"_rate"] ? (lang==="es"?"individual":"individual") : (lang==="es"?"global":"global")}
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ background:C.greenL, borderRadius:9, padding:"10px 14px", fontSize:12, color:C.green, fontWeight:700, marginTop:16 }}>
              {t.cfg_note}
            </div>
          </div>
        </div>
      )}

      {showShiftForm && (
        <WeeklyShiftModal
          lang={lang}
          employees={employees}
          roleLabels={roleLabels}
          calcHours={calcHours}
          onClose={()=>setShowShiftForm(false)}
          onSave={(shifts)=>{
            shifts.forEach(s=>dispatch({type:"ADD_SHIFT",shift:s}));
            setShowShiftForm(false);
          }}
        />
      )}
    </div>
  );
}

// ── Weekly Shift Scheduler Modal ──────────────────────────────────────────
function WeeklyShiftModal({ lang, employees, roleLabels, calcHours, onClose, onSave }) {
  const DAY_NAMES = lang==="es"
    ? ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"]
    : ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const DAY_FULL = lang==="es"
    ? ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"]
    : ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

  // Get Monday of the current week
  const getMonday = (date) => {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day===0?-6:1);
    d.setDate(diff); d.setHours(0,0,0,0);
    return d.toISOString().split("T")[0];
  };

  const [empId,    setEmpId]    = useState("");
  const [weekStart,setWeekStart]= useState(getMonday(today()));
  const [start,    setStart]    = useState("09:00");
  const [end,      setEnd]      = useState("18:00");
  const [days,     setDays]     = useState([true,true,true,true,true,false,false]); // Mon-Fri on, Sat-Sun off
  const [saved,    setSaved]    = useState(false);

  const toggleDay = i => setDays(d=>d.map((v,j)=>j===i?!v:v));

  // Get date for each day of the selected week
  const weekDates = Array.from({length:7},(_,i)=>{
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    return d.toISOString().split("T")[0];
  });

  const hours = calcHours(start,end);
  const selectedDays = days.filter(Boolean).length;

  const handleSave = () => {
    if(!empId){ alert(lang==="es"?"Selecciona un empleado.":"Select an employee."); return; }
    if(selectedDays===0){ alert(lang==="es"?"Selecciona al menos un día.":"Select at least one day."); return; }
    const emp = employees.find(e=>e.id===Number(empId));
    const shifts = weekDates
      .filter((_,i)=>days[i])
      .map(date=>({ id:Date.now()+Math.random(), employeeId:emp.id, employeeName:emp.name, date, start, end, hours, status:"scheduled" }));
    onSave(shifts);
    setSaved(true);
  };

  return (
    <Modal title={lang==="es"?"📅 Programar Semana":"📅 Schedule Week"} onClose={onClose} width={580}>
      {/* Employee */}
      <Field label={lang==="es"?"Empleado":"Employee"}>
        <select style={{...({border:`1.5px solid #E2E8F0`,borderRadius:9,padding:"9px 12px",fontSize:13,width:"100%",outline:"none",background:"#fff",color:"#1a1a2e"}), width:"100%"}} value={empId} onChange={e=>setEmpId(e.target.value)}>
          <option value="">{lang==="es"?"— Seleccionar empleado —":"— Select employee —"}</option>
          {employees.map(e=><option key={e.id} value={e.id}>{e.name} ({roleLabels[e.role]||e.role})</option>)}
        </select>
      </Field>

      {/* Week picker */}
      <Field label={lang==="es"?"Semana (selecciona cualquier día)":"Week (pick any day in the week)"}>
        <input style={{border:`1.5px solid #E2E8F0`,borderRadius:9,padding:"9px 12px",fontSize:13,width:"100%",outline:"none"}}
          type="date" value={weekStart}
          onChange={e=>setWeekStart(getMonday(e.target.value))} />
      </Field>
      <div style={{ fontSize:12, color:"#64748B", marginBottom:16, marginTop:-8 }}>
        📅 {lang==="es"?"Semana del":"Week of"} <b>{weekStart}</b> {lang==="es"?"al":"to"} <b>{weekDates[6]}</b>
      </div>

      {/* Hours */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
        <Field label={lang==="es"?"Hora Entrada":"Start Time"}>
          <input style={{border:`1.5px solid #E2E8F0`,borderRadius:9,padding:"9px 12px",fontSize:13,width:"100%",outline:"none"}}
            type="time" value={start} onChange={e=>setStart(e.target.value)} />
        </Field>
        <Field label={lang==="es"?"Hora Salida":"End Time"}>
          <input style={{border:`1.5px solid #E2E8F0`,borderRadius:9,padding:"9px 12px",fontSize:13,width:"100%",outline:"none"}}
            type="time" value={end} onChange={e=>setEnd(e.target.value)} />
        </Field>
      </div>

      {/* Duration info */}
      <div style={{ background:"#FFF7ED", borderRadius:9, padding:"8px 14px", marginBottom:16, fontSize:12, fontWeight:700, color:"#C2410C" }}>
        ⏱ {hours}h {lang==="es"?"por turno":"per shift"} &nbsp;·&nbsp; {selectedDays} {lang==="es"?"días seleccionados":"days selected"} &nbsp;·&nbsp; {(hours*selectedDays).toFixed(1)}h {lang==="es"?"total":"total"}
      </div>

      {/* Day selector */}
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:12, fontWeight:700, color:"#64748B", marginBottom:10 }}>
          {lang==="es"?"Días de trabajo (desmarca los días libres):":"Work days (uncheck days off):"}
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6 }}>
          {DAY_NAMES.map((d,i)=>(
            <div key={i} onClick={()=>toggleDay(i)}
              style={{ textAlign:"center", padding:"10px 4px", borderRadius:10, cursor:"pointer", border:`2px solid ${days[i]?"#E8650A":"#E2E8F0"}`, background:days[i]?"#FFF7ED":"#F8FAFC", transition:"all 0.15s" }}>
              <div style={{ fontSize:11, fontWeight:800, color:days[i]?"#C2410C":"#94A3B8" }}>{d}</div>
              <div style={{ fontSize:10, color:"#94A3B8", marginTop:2 }}>{weekDates[i]?.slice(5)}</div>
              <div style={{ marginTop:4, fontSize:16 }}>{days[i]?"✅":"❌"}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Preview */}
      {empId && selectedDays>0 && (
        <div style={{ background:"#F0FDF4", borderRadius:9, padding:"10px 14px", marginBottom:16, fontSize:12 }}>
          <div style={{ fontWeight:800, color:"#166534", marginBottom:6 }}>
            {lang==="es"?"Vista previa — Turnos a crear:":"Preview — Shifts to create:"}
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {weekDates.filter((_,i)=>days[i]).map(date=>(
              <span key={date} style={{ background:"#DCFCE7", color:"#166534", borderRadius:6, padding:"3px 8px", fontSize:11, fontWeight:700 }}>
                {date} {start}→{end}
              </span>
            ))}
          </div>
        </div>
      )}

      <button style={{ background:"#E8650A", color:"#fff", border:"none", borderRadius:10, padding:"12px 0", width:"100%", fontSize:14, fontWeight:800, cursor:"pointer" }} onClick={handleSave}>
        📅 {lang==="es"?`Crear ${selectedDays} Turno${selectedDays!==1?"s":""}`:`Create ${selectedDays} Shift${selectedDays!==1?"s":""}`}
      </button>
    </Modal>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// EMPLOYEES
// ═══════════════════════════════════════════════════════════════════════════
function Employees({ state, dispatch }) {
  const { lang } = React.useContext(LangCtx);
  const t = T[lang];
  const [showForm,  setShowForm]  = useState(false);
  const [editing,   setEditing]   = useState(null);
  const [showPerms, setShowPerms] = useState(null);
  const [permForm,  setPermForm]  = useState([]);
  const [form, setForm] = useState({ name:"", email:"", phone:"", role:"employee", password:"", pin:"", permissions:[] });
  const [search, setSearch] = useState("");

  const isManager = ["manager","owner"].includes(state.currentUser.role);
  const ALL_PERMISSIONS = [
    { key:"view_accounting",  label:"View Accounting" },
    { key:"view_clients",     label:"View Clients" },
    { key:"create_invoices",  label:"Create Invoices" },
    { key:"manage_shifts",    label:"Manage Shifts" },
    { key:"view_hr",          label:"View HR & Payroll" },
    { key:"track_deliveries", label:"Track Deliveries" },
  ];
  const roleOptions = isManager ? ["employee","team_lead","driver","manager"] : ["employee","driver"];
  const roleLabels  = { manager:"Manager", team_lead:"Team Lead", employee:"Employee", driver:"Driver", owner:"Owner" };
  const roleColor   = r => ({manager:"#E8650A",team_lead:"#7C3AED",employee:"#0891B2",driver:"#D97706",owner:"#16A34A"}[r]||C.gray500);

  const filtered = state.users.filter(u=>
    (u.name||"").toLowerCase().includes(search.toLowerCase())||
    (u.email||"").toLowerCase().includes(search.toLowerCase())
  );

  const openNew = () => {
    setEditing(null);
    setForm({ name:"", email:"", phone:"", role:"employee", password:"", pin: Math.floor(1000+Math.random()*9000).toString(), permissions:[] });
    setShowForm(true);
  };
  const openEdit = u => {
    setEditing(u);
    setForm({ name:u.name, email:u.email, phone:u.phone||"", role:u.role, password:u.password, pin:u.pin, permissions:u.permissions||[] });
    setShowForm(true);
  };
  const save = () => {
    if(!form.name||!form.email||!form.password){ alert("Name, email and password are required."); return; }
    const avatar = initials(form.name);
    if(editing){
      dispatch({ type:"UPDATE_USER", user:{ ...editing, ...form, avatar } });
    } else {
      dispatch({ type:"ADD_USER", user:{ ...form, avatar, active:true, createdAt:today(), id:Date.now() } });
    }
    setShowForm(false); setEditing(null);
  };
  const upgradeToTL = u => {
    if(window.confirm(`Upgrade ${u.name} to Team Lead?`))
      dispatch({ type:"UPDATE_USER", user:{ ...u, role:"team_lead" } });
  };
  const savePerms = () => {
    dispatch({ type:"UPDATE_USER", user:{ ...showPerms, permissions: permForm } });
    setShowPerms(null);
  };

  return (
    <div>
      <PageHeader title={t.emp_title}>
        <input style={{ ...S.input, width:220 }} value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.search_emp} />
        {isManager && <button style={S.btn()} onClick={openNew}>{t.new_emp}</button>}
      </PageHeader>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:14 }}>
        {filtered.map(u=>(
          <div key={u.id} style={{ ...S.card, padding:"18px 20px", opacity:u.active===false?0.5:1 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
              <Avatar name={u.name} role={u.role} size={42} />
              <div>
                <div style={{ fontWeight:800, fontSize:14 }}>{u.name}</div>
                <span style={{ fontSize:11, fontWeight:700, color:roleColor(u.role), background:roleColor(u.role)+"20", borderRadius:20, padding:"2px 10px" }}>
                  {roleLabels[u.role]||u.role}
                </span>
              </div>
            </div>
            <div style={{ fontSize:12, color:C.gray500, lineHeight:1.9, marginBottom:12 }}>
              <div>📧 {u.email}</div>
              {u.phone && <div>📱 {u.phone}</div>}
              <div>📅 Joined {u.createdAt}</div>
              {u.role==="driver" && <div style={{ color:C.yellow, fontWeight:700, marginTop:4 }}>🚗 Paid per delivery</div>}
            </div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
              {isManager && <button style={{ ...S.btnSm(C.tealL,C.teal) }} onClick={()=>openEdit(u)}>{t.edit}</button>}
              {isManager && u.role==="employee" && u.id!==state.currentUser.id &&
                <button style={{ ...S.btnSm(C.purpleL,C.purple) }} onClick={()=>upgradeToTL(u)}>⬆ TL</button>}
              {isManager && ["team_lead","employee"].includes(u.role) && u.id!==state.currentUser.id &&
                <button style={{ ...S.btnSm(C.yellowL,C.yellow) }} onClick={()=>{ setShowPerms(u); setPermForm(u.permissions||[]); }}>🔑 Perms</button>}
              {isManager && u.id!==state.currentUser.id &&
                <button style={{ ...S.btnSm(u.active===false?C.greenL:C.redL, u.active===false?C.green:C.red) }}
                  onClick={()=>dispatch({ type:"TOGGLE_USER_ACTIVE", id:u.id })}>
                  {u.active===false?t.activate:t.deactivate}
                </button>}
            </div>
          </div>
        ))}
      </div>

      {showForm && (
        <Modal title={editing?`Edit — ${editing.name}`:"New Employee"} onClose={()=>setShowForm(false)} width={500}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
            <Field label="Full Name" style={{ gridColumn:"1/-1" }}>
              <input style={S.input} value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} />
            </Field>
            <Field label="Email">
              <input style={S.input} type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} />
            </Field>
            <Field label="Phone">
              <input style={S.input} value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} />
            </Field>
            <Field label="Role">
              <select style={S.input} value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))}>
                {roleOptions.map(r=><option key={r} value={r}>{roleLabels[r]}</option>)}
              </select>
            </Field>
            <Field label="Password">
              <input style={S.input} value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} />
            </Field>
            <Field label="PIN (4 digits)" style={{ gridColumn:"1/-1" }}>
              <input style={S.input} maxLength={4} value={form.pin} onChange={e=>setForm(f=>({...f,pin:e.target.value}))} />
            </Field>
          </div>
          <button style={{ ...S.btn(), width:"100%", justifyContent:"center", padding:"11px 0" }} onClick={save}>
            {editing?"Save Changes":"Create Employee"}
          </button>
        </Modal>
      )}

      {showPerms && (
        <Modal title={`🔑 Permissions — ${showPerms.name}`} onClose={()=>setShowPerms(null)} width={440}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20 }}>
            {ALL_PERMISSIONS.map(p=>{
              const has=permForm.includes(p.key);
              return (
                <label key={p.key} style={{ display:"flex", alignItems:"center", gap:8, fontSize:13, cursor:"pointer", padding:"8px 12px", borderRadius:8, background:has?C.purpleL:C.gray50, border:`1px solid ${has?C.purple:C.gray200}` }}>
                  <input type="checkbox" checked={has} onChange={()=>setPermForm(f=>has?f.filter(x=>x!==p.key):[...f,p.key])} />
                  {p.label}
                </label>
              );
            })}
          </div>
          <button style={{ ...S.btn(), width:"100%", justifyContent:"center", padding:"11px 0" }} onClick={savePerms}>
            Save Permissions
          </button>
        </Modal>
      )}
    </div>
  );
}

// DELIVERY TRACKER
// ═══════════════════════════════════════════════════════════════════════════
function DeliveryTracker({ state, dispatch }) {
  const { lang } = React.useContext(LangCtx);
  const role      = state.currentUser.role;
  const isManager = ["manager","owner"].includes(role);
  const isTL      = role === "team_lead";

  const DT = {
    en: {
      title:"Delivery Tracking", title_tl:"Deliveries",
      tab_log:"Delivery Log", tab_add:"+ Add Delivery",
      tab_config:"Driver Prices", tab_pay:"Pay Summary",
      driver:"Driver", date:"Date", qty:"Qty of Deliveries",
      notes:"Notes (optional)", type:"Delivery Type",
      local:"Local Delivery", extended:"Extended Delivery",
      add:"Add", saved:"Delivery recorded successfully!",
      no_drivers:"No drivers available. Ask the manager to add a driver account.",
      log_title:"Delivery Log", all_drivers:"All Drivers",
      col_driver:"Driver", col_date:"Date", col_del:"Deliveries",
      col_notes:"Notes", col_by:"Recorded By", col_type:"Type",
      no_deliveries:"No deliveries recorded yet.",
      config_title:"Driver Price Configuration",
      config_sub:"Set prices per delivery type for each driver (RD$).",
      local_price:"Local (RD$)", ext_price:"Extended (RD$)",
      save:"Save", current:"current",
      pay_title:"Bi-Weekly Pay Summary",
      pay_sub:"Deliveries in last 14 days × price per delivery type.",
      col_rate_local:"Local Rate", col_rate_ext:"Ext. Rate",
      col_local:"Local (14d)", col_ext:"Ext. (14d)",
      col_total_pay:"Total Pay", col_status:"Status",
      not_set:"Not set", ready:"Ready", price_not_set:"Price not set",
      total_payout:"Total Bi-Weekly Payout", all_time:"ALL TIME",
      biweekly:"BI-WEEKLY", pay_due:"PAY DUE",
      select_driver:"— Select driver —",
    },
    es: {
      title:"Seguimiento de Entregas", title_tl:"Entregas",
      tab_log:"Registro", tab_add:"+ Agregar", 
      tab_config:"Precios", tab_pay:"Nómina",
      driver:"Conductor", date:"Fecha", qty:"Cantidad de Entregas",
      notes:"Notas (opcional)", type:"Tipo de Entrega",
      local:"Entrega Local", extended:"Entrega a Domicilio",
      add:"Agregar", saved:"¡Entrega registrada exitosamente!",
      no_drivers:"No hay conductores disponibles. Pida al gerente que agregue un conductor.",
      log_title:"Registro de Entregas", all_drivers:"Todos los Conductores",
      col_driver:"Conductor", col_date:"Fecha", col_del:"Entregas",
      col_notes:"Notas", col_by:"Registrado Por", col_type:"Tipo",
      no_deliveries:"Aún no hay entregas registradas.",
      config_title:"Configuración de Precios",
      config_sub:"Configure los precios por tipo de entrega para cada conductor (RD$).",
      local_price:"Local (RD$)", ext_price:"A Domicilio (RD$)",
      save:"Guardar", current:"actual",
      pay_title:"Resumen de Pago Quincenal",
      pay_sub:"Entregas en los últimos 14 días × precio por tipo.",
      col_rate_local:"Precio Local", col_rate_ext:"Precio Domicilio",
      col_local:"Local (14d)", col_ext:"Domicilio (14d)",
      col_total_pay:"Pago Total", col_status:"Estado",
      not_set:"No configurado", ready:"Listo", price_not_set:"Precio no configurado",
      total_payout:"Pago Quincenal Total", all_time:"TODO EL TIEMPO",
      biweekly:"QUINCENAL", pay_due:"PAGO PENDIENTE",
      select_driver:"— Seleccionar conductor —",
    }
  };
  const t = DT[lang]||DT.en;

  const [tab,       setTab]      = useState("log");
  const [driverId,  setDriverId] = useState("");
  const [date,      setDate]     = useState(today());
  const [qty,       setQty]      = useState(1);
  const [notes,     setNotes]    = useState("");
  const [delType,   setDelType]  = useState("local");
  const [filter,    setFilter]   = useState("all");
  const [saved,     setSaved]    = useState(false);
  const [prices,    setPrices]   = useState({});
  const [editPrice, setEditPrice]= useState({});

  const drivers    = state.users.filter(u=>u.role==="driver"&&u.active!==false);
  const deliveries = state.deliveries||[];

  React.useEffect(()=>{
    try{ const p=JSON.parse(localStorage.getItem("fs_driver_prices")||"{}"); setPrices(p); }catch(e){}
  },[]);

  const savePrices = updated => {
    setPrices(updated);
    localStorage.setItem("fs_driver_prices", JSON.stringify(updated));
  };

  const filtered = deliveries.filter(d=>filter==="all"?true:d.driverId===Number(filter));

  const summary = drivers.map(d=>{
    const dd         = deliveries.filter(x=>x.driverId===d.id);
    const total      = dd.reduce((s,x)=>s+x.qty,0);
    const now=new Date(), twa=new Date(now); twa.setDate(now.getDate()-14);
    const recent     = dd.filter(x=>new Date(x.date)>=twa);
    const biweekly   = recent.reduce((s,x)=>s+x.qty,0);
    const localQty   = recent.filter(x=>x.delType==="local").reduce((s,x)=>s+x.qty,0);
    const extQty     = recent.filter(x=>x.delType==="extended").reduce((s,x)=>s+x.qty,0);
    const pLocal     = Number(prices[d.id+"_local"]||prices[d.id]||0);
    const pExt       = Number(prices[d.id+"_ext"]||prices[d.id]||0);
    const amountDue  = localQty*pLocal + extQty*pExt;
    return {...d, total, biweekly, localQty, extQty, pLocal, pExt, amountDue};
  });

  const addDelivery = () => {
    if(!driverId||!qty){ alert(lang==="es"?"Selecciona un conductor e ingresa una cantidad.":"Select a driver and enter a quantity."); return; }
    const driver = drivers.find(d=>d.id===Number(driverId));
    dispatch({ type:"ADD_DELIVERY", delivery:{
      id:Date.now(), driverId:Number(driverId),
      driverName:driver?.name||"", date,
      qty:Number(qty), notes, delType,
      recordedBy:state.currentUser.name
    }});
    setDriverId(""); setQty(1); setNotes(""); setDelType("local");
    setSaved(true); setTimeout(()=>setSaved(false),2500);
  };

  const tabBtn = (key,label) => (
    <button key={key} onClick={()=>setTab(key)} style={{
      padding:"8px 18px", borderRadius:20, border:"none", cursor:"pointer",
      fontWeight:700, fontSize:12,
      background: tab===key ? C.orange : C.gray100,
      color:       tab===key ? "#fff"   : C.gray600,
    }}>{label}</button>
  );

  const typeTag = type => (
    <span style={{ ...S.badge(type==="local"?C.tealL:C.purpleL, type==="local"?C.teal:C.purple), fontSize:10 }}>
      {type==="local"?t.local:t.extended}
    </span>
  );

  // ── ADD FORM (inline JSX) ─────────────────────────────────────────────────
  const addFormJSX = (
    <div style={{ ...S.card, padding:"24px 28px", marginBottom:24 }}>
      <div style={{ fontWeight:800, fontSize:14, color:C.gray800, marginBottom:16 }}>➕ {t.tab_add.replace("+ ","")}</div>
      {saved && <div style={{ background:C.greenL, color:C.green, borderRadius:9, padding:"10px 14px", marginBottom:14, fontWeight:700 }}>✅ {t.saved}</div>}
      {drivers.length===0 ? (
        <div style={{ color:C.gray400, fontSize:13 }}>{t.no_drivers}</div>
      ) : (
        <>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>
            <Field label={t.driver}>
              <select style={S.input} value={driverId} onChange={e=>setDriverId(e.target.value)}>
                <option value="">{t.select_driver}</option>
                {drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </Field>
            <Field label={t.date}>
              <input style={S.input} type="date" value={date} onChange={e=>setDate(e.target.value)} />
            </Field>
            <Field label={t.qty}>
              <input style={S.input} type="number" min="1" value={qty} onChange={e=>setQty(e.target.value)} />
            </Field>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:16 }}>
            <Field label={t.type}>
              <select style={S.input} value={delType} onChange={e=>setDelType(e.target.value)}>
                <option value="local">{t.local}</option>
                <option value="extended">{t.extended}</option>
              </select>
            </Field>
            <Field label={t.notes}>
              <input style={S.input} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="e.g. Zone A" />
            </Field>
          </div>
          <button style={{ ...S.btn(), padding:"11px 32px", fontSize:14 }} onClick={addDelivery}>{t.add}</button>
        </>
      )}
    </div>
  );

  // ── LOG (inline JSX) ──────────────────────────────────────────────────────
  const logJSX = (
    <div style={S.card}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
        <div style={{ fontWeight:800, fontSize:14, color:C.gray800 }}>📋 {t.log_title}</div>
        <select style={{ ...S.input, width:200 }} value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="all">{t.all_drivers}</option>
          {drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>
      <table style={{ width:"100%", borderCollapse:"collapse" }}>
        <thead>
          <tr>{[t.col_driver,t.col_date,t.col_del,t.col_type,t.col_notes,t.col_by,isManager?"":""].map((h,i)=><th key={i} style={S.th}>{h}</th>)}</tr>
        </thead>
        <tbody>
          {[...filtered].map(d=>(
            <tr key={d.id}>
              <td style={S.td}><b>{d.driverName}</b></td>
              <td style={S.td}>{d.date}</td>
              <td style={S.td}><b style={{ color:C.orange, fontSize:18 }}>{d.qty}</b></td>
              <td style={S.td}>{typeTag(d.delType||"local")}</td>
              <td style={S.td}>{d.notes||"—"}</td>
              <td style={S.td}>{d.recordedBy}</td>
              {isManager && <td style={S.td}><button style={S.btnSm(C.redL,C.red)} onClick={()=>dispatch({type:"DELETE_DELIVERY",id:d.id})}>Del</button></td>}
            </tr>
          ))}
          {filtered.length===0 && <tr><td colSpan={7} style={{ ...S.td, textAlign:"center", color:C.gray400, padding:32 }}>{t.no_deliveries}</td></tr>}
        </tbody>
      </table>
    </div>
  );

  // ── TEAM LEAD VIEW ────────────────────────────────────────────────────────
  if(isTL) return (
    <div>
      <PageHeader title={"🚗 "+t.title_tl} />
      <div style={{ display:"flex", gap:8, marginBottom:20, background:C.gray50, padding:4, borderRadius:24, width:"fit-content", border:`1px solid ${C.gray200}` }}>
        {tabBtn("add", t.tab_add)}
        {tabBtn("log", t.tab_log)}
      </div>
      {tab==="add" && addFormJSX}
      {tab==="log" && logJSX}
    </div>
  );

  // ── MANAGER VIEW ──────────────────────────────────────────────────────────
  return (
    <div>
      <PageHeader title={"🚗 "+t.title} />

      {/* Driver Summary Cards */}
      {drivers.length>0 && (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))", gap:14, marginBottom:24 }}>
          {summary.map(d=>(
            <div key={d.id} style={{ ...S.card, padding:"18px 20px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
                <Avatar name={d.name} role="driver" size={40} />
                <div>
                  <div style={{ fontWeight:800, fontSize:14 }}>{d.name}</div>
                  <div style={{ fontSize:11, color:C.yellow, fontWeight:700 }}>🚗 Driver</div>
                </div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                <div style={{ background:C.tealL, borderRadius:8, padding:"8px 12px", textAlign:"center" }}>
                  <div style={{ fontSize:22, fontWeight:900, color:C.teal }}>{d.total}</div>
                  <div style={{ fontSize:10, color:C.teal, fontWeight:700 }}>{t.all_time}</div>
                </div>
                <div style={{ background:C.orangeL, borderRadius:8, padding:"8px 12px", textAlign:"center" }}>
                  <div style={{ fontSize:22, fontWeight:900, color:C.orange }}>{d.biweekly}</div>
                  <div style={{ fontSize:10, color:C.orange, fontWeight:700 }}>{t.biweekly}</div>
                </div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
                <div style={{ background:C.tealL+"88", borderRadius:8, padding:"6px 10px", textAlign:"center" }}>
                  <div style={{ fontSize:16, fontWeight:800, color:C.teal }}>{d.localQty}</div>
                  <div style={{ fontSize:10, color:C.teal, fontWeight:700 }}>{t.local}</div>
                </div>
                <div style={{ background:C.purpleL, borderRadius:8, padding:"6px 10px", textAlign:"center" }}>
                  <div style={{ fontSize:16, fontWeight:800, color:C.purple }}>{d.extQty}</div>
                  <div style={{ fontSize:10, color:C.purple, fontWeight:700 }}>{t.extended}</div>
                </div>
              </div>
              {(d.pLocal>0||d.pExt>0) && (
                <div style={{ background:C.greenL, borderRadius:8, padding:"8px 12px", textAlign:"center" }}>
                  <div style={{ fontSize:17, fontWeight:900, color:C.green }}>{fmtCurrency(d.amountDue)}</div>
                  <div style={{ fontSize:10, color:C.green, fontWeight:700 }}>{t.pay_due}</div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Tab Nav */}
      <div style={{ display:"flex", gap:8, marginBottom:20, background:C.gray50, padding:4, borderRadius:24, width:"fit-content", border:`1px solid ${C.gray200}` }}>
        {tabBtn("log",     t.tab_log)}
        {tabBtn("add",     t.tab_add)}
        {tabBtn("config",  t.tab_config)}
        {tabBtn("payroll", t.tab_pay)}
      </div>

      {tab==="log" && logJSX}
      {tab==="add" && addFormJSX}

      {/* DRIVER PRICES CONFIG */}
      {tab==="config" && (
        <div style={S.card}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:6 }}>⚙️ {t.config_title}</div>
          <div style={{ fontSize:13, color:C.gray500, marginBottom:20 }}>{t.config_sub}</div>
          {drivers.length===0 ? (
            <div style={{ color:C.gray400, textAlign:"center", padding:32 }}>No drivers found.</div>
          ) : (
            <div style={{ display:"grid", gap:14 }}>
              {drivers.map(d=>(
                <div key={d.id} style={{ ...S.cardSm, display:"flex", alignItems:"center", gap:16, flexWrap:"wrap" }}>
                  <Avatar name={d.name} role="driver" size={42} />
                  <div style={{ fontWeight:800, fontSize:14, minWidth:100 }}>{d.name}</div>
                  <div style={{ display:"flex", alignItems:"center", gap:8, flex:1, flexWrap:"wrap" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <span style={{ fontSize:12, color:C.teal, fontWeight:700, whiteSpace:"nowrap" }}>🏠 {t.local_price}</span>
                      <input style={{ ...S.input, width:90, padding:"6px 10px" }} type="number" min="0"
                        value={editPrice[d.id+"_local"]!==undefined?editPrice[d.id+"_local"]:(prices[d.id+"_local"]||"")}
                        onChange={e=>setEditPrice(p=>({...p,[d.id+"_local"]:e.target.value}))}
                        placeholder="0" />
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <span style={{ fontSize:12, color:C.purple, fontWeight:700, whiteSpace:"nowrap" }}>🏘 {t.ext_price}</span>
                      <input style={{ ...S.input, width:90, padding:"6px 10px" }} type="number" min="0"
                        value={editPrice[d.id+"_ext"]!==undefined?editPrice[d.id+"_ext"]:(prices[d.id+"_ext"]||"")}
                        onChange={e=>setEditPrice(p=>({...p,[d.id+"_ext"]:e.target.value}))}
                        placeholder="0" />
                    </div>
                    <button style={{ ...S.btn(C.tealL,C.teal), padding:"7px 16px" }} onClick={()=>{
                      const updated={...prices};
                      if(editPrice[d.id+"_local"]!==undefined) updated[d.id+"_local"]=Number(editPrice[d.id+"_local"]);
                      if(editPrice[d.id+"_ext"]!==undefined)   updated[d.id+"_ext"]=Number(editPrice[d.id+"_ext"]);
                      savePrices(updated);
                      setEditPrice(p=>{const n={...p};delete n[d.id+"_local"];delete n[d.id+"_ext"];return n;});
                    }}>{t.save}</button>
                  </div>
                  <div style={{ display:"flex", gap:10 }}>
                    <div style={{ textAlign:"center" }}>
                      <div style={{ fontSize:14, fontWeight:900, color:C.teal }}>{fmtCurrency(prices[d.id+"_local"]||0)}</div>
                      <div style={{ fontSize:9, color:C.gray400 }}>Local</div>
                    </div>
                    <div style={{ textAlign:"center" }}>
                      <div style={{ fontSize:14, fontWeight:900, color:C.purple }}>{fmtCurrency(prices[d.id+"_ext"]||0)}</div>
                      <div style={{ fontSize:9, color:C.gray400 }}>Extended</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* PAY SUMMARY */}
      {tab==="payroll" && (
        <div style={S.card}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:6 }}>💰 {t.pay_title}</div>
          <div style={{ fontSize:13, color:C.gray500, marginBottom:20 }}>{t.pay_sub}</div>
          {drivers.length===0 ? (
            <div style={{ color:C.gray400, textAlign:"center", padding:32 }}>No drivers found.</div>
          ) : (
            <>
              <table style={{ width:"100%", borderCollapse:"collapse", marginBottom:20 }}>
                <thead>
                  <tr>{[t.col_driver,t.col_rate_local,t.col_rate_ext,t.col_local,t.col_ext,t.col_total_pay,t.col_status].map((h,i)=><th key={i} style={S.th}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {summary.map(d=>(
                    <tr key={d.id}>
                      <td style={S.td}><div style={{ display:"flex", alignItems:"center", gap:10 }}><Avatar name={d.name} role="driver" size={28} /><b>{d.name}</b></div></td>
                      <td style={S.td}>{d.pLocal>0?<span style={{ color:C.teal, fontWeight:700 }}>{fmtCurrency(d.pLocal)}</span>:<span style={{ color:C.red, fontSize:11 }}>{t.not_set}</span>}</td>
                      <td style={S.td}>{d.pExt>0?<span style={{ color:C.purple, fontWeight:700 }}>{fmtCurrency(d.pExt)}</span>:<span style={{ color:C.red, fontSize:11 }}>{t.not_set}</span>}</td>
                      <td style={S.td}><b style={{ color:C.teal }}>{d.localQty}</b></td>
                      <td style={S.td}><b style={{ color:C.purple }}>{d.extQty}</b></td>
                      <td style={S.td}><b style={{ fontSize:15, color:C.green }}>{fmtCurrency(d.amountDue)}</b></td>
                      <td style={S.td}>{(d.pLocal===0&&d.pExt===0)?<span style={{ ...S.badge(C.redL,C.red) }}>{t.price_not_set}</span>:<span style={{ ...S.badge(C.greenL,C.green) }}>{t.ready}</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{ background:C.gray50, borderRadius:10, padding:"14px 20px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div style={{ fontWeight:800, fontSize:14, color:C.gray700 }}>💰 {t.total_payout}</div>
                <div style={{ fontSize:24, fontWeight:900, color:C.green }}>{fmtCurrency(summary.reduce((s,d)=>s+d.amountDue,0))}</div>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════
const API = {
  get:    url     => fetch(url).then(r=>r.json()),
  post:   (url,b) => fetch(url,{method:"POST",  headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()),
  put:    (url,b) => fetch(url,{method:"PUT",   headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()),
  patch:  (url,b) => fetch(url,{method:"PATCH", headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()),
  del:    url     => fetch(url,{method:"DELETE"}).then(r=>r.json()),
};

function App() {
  const [state, dispatch]   = useReducer(reducer, initState);
  const [active, setActive] = useState("dashboard");
  const [invoiceClientId, setInvoiceClientId] = useState(null);
  const [lang, setLang]     = useState("en");
  const [appLoading, setAppLoading] = useState(false);

  // DB-first dispatch: save to DB, then update UI with real ID
  const dbDispatch = async action => {
    try {
      switch(action.type) {
        case "ADD_CLIENT": {
          const r = await API.post("/api/clients", action.client);
          if(r.id) dispatch({type:"ADD_CLIENT", client:{...action.client, id:r.id}});
          break;
        }
        case "UPDATE_CLIENT":
          await API.put(`/api/clients/${action.client.id}`, action.client);
          dispatch(action); break;
        case "DELETE_CLIENT":
          await API.del(`/api/clients/${action.id}`);
          dispatch(action); break;
        case "ADD_INVOICE":
          await API.post("/api/invoices", action.invoice);
          dispatch(action); break;
        case "UPDATE_INVOICE_STATUS": {
          const inv = state.invoices.find(i=>i.id===action.id);
          const loyaltyGain = inv&&inv.status!=="delivered"&&action.status==="delivered"?Math.floor(inv.total/10):0;
          await API.patch(`/api/invoices/${action.id}`, {status:action.status,clientId:inv?.clientId,loyaltyGain});
          dispatch(action); break;
        }
        case "DELETE_INVOICE":
          await API.del(`/api/invoices/${action.id}`);
          dispatch(action); break;
        case "ADD_EXPENSE": {
          const r = await API.post("/api/expenses", action.expense);
          if(r.id) dispatch({type:"ADD_EXPENSE", expense:{...action.expense, id:r.id}});
          break;
        }
        case "DELETE_EXPENSE":
          await API.del(`/api/expenses/${action.id}`);
          dispatch(action); break;
        case "ADD_SHIFT": {
          const r = await API.post("/api/shifts", action.shift);
          if(r.id) dispatch({type:"ADD_SHIFT", shift:{...action.shift, id:r.id}});
          break;
        }
        case "UPDATE_SHIFT":
          await API.put(`/api/shifts/${action.shift.id}`, action.shift);
          dispatch(action); break;
        case "DELETE_SHIFT":
          await API.del(`/api/shifts/${action.id}`);
          dispatch(action); break;
        case "ADD_USER": {
          const r = await API.post("/api/users", action.user);
          if(r.id) dispatch({type:"ADD_USER", user:{...action.user, id:r.id}});
          break;
        }
        case "UPDATE_USER":
          await API.put(`/api/users/${action.user.id}`, action.user);
          dispatch(action); break;
        case "TOGGLE_USER_ACTIVE":
          await API.patch(`/api/users/${action.id}`, {});
          dispatch(action); break;
        case "UPDATE_HR_CONFIG":
          await API.put("/api/hrconfig", action.config);
          dispatch(action); break;
        case "ADD_SUBSCRIPTION": {
          const r = await API.post("/api/subscriptions", action.sub);
          if(r.id) dispatch({type:"ADD_SUBSCRIPTION", sub:{...action.sub, id:r.id}});
          break;
        }
        case "UPDATE_SUBSCRIPTION":
          await API.put(`/api/subscriptions/${action.sub.id}`, action.sub);
          dispatch(action); break;
        case "ADD_DELIVERY": {
          const r = await API.post("/api/deliveries", action.delivery);
          if(r.id) dispatch({type:"ADD_DELIVERY", delivery:{...action.delivery, id:r.id}});
          break;
        }
        case "DELETE_DELIVERY":
          await API.del(`/api/deliveries/${action.id}`);
          dispatch(action); break;
        default:
          dispatch(action); break;
      }
    } catch(err) {
      console.error("DB error:", err);
      alert("⚠️ Save failed. Check your connection and try again.");
    }
  };

  if (!state.currentUser) return (
    <LangCtx.Provider value={{ lang, setLang }}>
      <LoginScreen state={state} dispatch={dispatch} />
    </LangCtx.Provider>
  );

  const role    = state.currentUser.role;
  const allowed = ROLE_ACCESS[role] || [];
  const handleNewInvoice = clientId => { setInvoiceClientId(clientId); setActive("pos"); setTimeout(()=>setInvoiceClientId(null),200); };

  const renderPage = () => {
    const t = T[lang];
    if(!allowed.includes(active)) return <div style={{ ...S.card, textAlign:"center", color:C.gray400, padding:48 }}>{t.access_restricted}</div>;
    switch(active) {
      case "dashboard":  return <Dashboard      state={state} setActive={setActive} />;
      case "pos":        return <POS            state={state} dispatch={dbDispatch} prefillClientId={invoiceClientId} />;
      case "clients":    return <Clients        state={state} dispatch={dbDispatch} onNewInvoice={handleNewInvoice} />;
      case "shifts":     return <MyShifts       state={state} dispatch={dbDispatch} />;
      case "accounting": return <Accounting     state={state} dispatch={dbDispatch} />;
      case "hr":         return <HR             state={state} dispatch={dbDispatch} />;
      case "employees":  return <Employees      state={state} dispatch={dbDispatch} />;
      case "deliveries": return <DeliveryTracker state={state} dispatch={dbDispatch} />;
      default:           return null;
    }
  };

  return (
    <LangCtx.Provider value={{ lang, setLang }}>
      <div style={{ ...S.page, display:"flex" }}>
        <Sidebar active={active} setActive={setActive} user={state.currentUser} dispatch={dispatch} />
        <main id="main" style={{ flex:1, padding:"28px 32px", overflowY:"auto", maxHeight:"100vh" }}>
          {renderPage()}
        </main>
      </div>
    </LangCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
